<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="NovaVesta"
>

<meta
    name="theme-color"
    content="#07100b"
>

<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<title>NovaVesta</title>

<style>

/* ==================================================
   NOVAVESTA — VIRIDITAS VESTAE
   ================================================== */

:root {

    --bg: #07100b;
    --panel: #0d1a12;
    --panel-active: #102319;
    --panel-light: #13271b;

    --green: #55d68a;
    --green-bright: #7affad;
    --green-dim: #347a50;

    --text: #edf8f0;
    --muted: #789080;

    --border:
        rgba(85, 214, 138, 0.17);

    --danger: #d86b6b;

    --glow:
        0 0 18px
        rgba(85, 214, 138, 0.18);
}


* {

    box-sizing: border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html {

    background: var(--bg);

    -webkit-text-size-adjust: 100%;

    text-size-adjust: 100%;

    min-height: 100%;

}


body {

    margin: 0;

    min-height: 100vh;

    min-height: 100dvh;

    overflow-x: hidden;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(44, 130, 76, 0.18),
            transparent 45%
        ),

        var(--bg);

    color: var(--text);

    font-family:

        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    touch-action: manipulation;

}


/* ==================================================
   APP
   ================================================== */

.app {

    width: 100%;

    max-width: 680px;

    margin: 0 auto;

    padding-top:
        max(22px, env(safe-area-inset-top));

    padding-left:
        max(18px, env(safe-area-inset-left));

    padding-right:
        max(18px, env(safe-area-inset-right));

    padding-bottom:
        calc(
            40px +
            env(safe-area-inset-bottom)
        );

}


/* ==================================================
   HEADER
   ================================================== */

header {

    text-align: center;

    padding-top: 8px;

    margin-bottom: 24px;

}


.flame {

    font-size: 25px;

    color:
        var(--green-bright);

    text-shadow:
        0 0 15px
        rgba(122, 255, 173, 0.5);

    margin-bottom: 4px;

}


h1 {

    margin: 0;

    font-size: 29px;

    line-height: 1.15;

    font-weight: 600;

    letter-spacing: -0.4px;

}


.date {

    margin-top: 7px;

    color: var(--muted);

    font-size: 14px;

}


/* ==================================================
   PROGRESS
   ================================================== */

.progress {

    text-align: center;

    margin-bottom: 18px;

    color: var(--muted);

    font-size: 14px;

}


.progress strong {

    color: var(--green);

}


/* ==================================================
   TIME OF DAY SECTIONS
   ================================================== */

.time-section {

    margin-bottom: 18px;

}


.time-heading {

    display: flex;

    align-items: center;

    justify-content: space-between;

    width: 100%;

    min-height: 42px;

    padding: 8px 4px;

    background: transparent;

    border: none;

    color: var(--text);

    font-family: inherit;

    font-size: 18px;

    font-weight: 550;

    text-align: left;

    cursor: pointer;

}


.time-heading:active {

    color: var(--green);

}


.time-heading-left {

    display: flex;

    align-items: center;

    gap: 9px;

}


.time-heading-arrow {

    color: var(--green-dim);

    font-size: 13px;

    width: 14px;

    transition:
        transform 0.15s ease;

}


.time-section.collapsed
.time-heading-arrow {

    transform:
        rotate(-90deg);

}


.time-section-content {

    overflow: hidden;

    max-height: 5000px;

    opacity: 1;

    transition:
        max-height 0.2s ease,
        opacity 0.15s ease;

}


.time-section.collapsed
.time-section-content {

    max-height: 0;

    opacity: 0;

}


/* ==================================================
   ROUTINE
   ================================================== */

.routine {

    display: flex;

    flex-direction: column;

    gap: 9px;

}


/* ==================================================
   TASK
   ================================================== */

.task-wrapper {

    width: 100%;

    touch-action: pan-y;

}


.item {

    display: flex;

    align-items: center;

    gap: 10px;

    width: 100%;

    min-height: 68px;

    padding:
        12px
        7px
        12px
        14px;

    background:
        rgba(13, 26, 18, 0.96);

    border:
        1px solid var(--border);

    border-radius: 14px;

    transition:
        background 0.15s ease,
        border-color 0.15s ease,
        opacity 0.15s ease,
        transform 0.15s ease;

}


.item.dragging {

    opacity: 0.55;

    transform:
        scale(1.02);

    box-shadow:
        var(--glow);

}


.item:active {

    background:
        var(--panel-active);

    border-color:
        rgba(85, 214, 138, 0.32);

}


.item.completed {

    opacity: 0.67;

}


/* ==================================================
   CHECKBOX
   ================================================== */

.checkbox {

    appearance: none;

    -webkit-appearance: none;

    width: 30px;

    height: 30px;

    min-width: 30px;

    margin: 0;

    border:
        2px solid
        var(--green-dim);

    border-radius: 9px;

    background: transparent;

    position: relative;

    cursor: pointer;

}


.checkbox::before {

    content: "";

    position: absolute;

    inset: -10px;

}


.checkbox:checked {

    background:
        var(--green);

    border-color:
        var(--green);

    box-shadow:
        0 0 14px
        rgba(85, 214, 138, 0.32);

}


.checkbox:checked::after {

    content: "✓";

    position: absolute;

    left: 4px;

    top: -1px;

    color: #07100b;

    font-size: 21px;

    font-weight: 800;

}


/* ==================================================
   TASK CONTENT
   ================================================== */

.item-content {

    flex: 1;

    min-width: 0;

}


.item-name {

    font-size: 17px;

    line-height: 1.3;

    font-weight: 450;

    word-break: break-word;

    cursor: pointer;

}


.item-name:active {

    color:
        var(--green);

}


.completed .item-name {

    text-decoration: line-through;

    color: #91a598;

}


.timestamp {

    margin-top: 3px;

    min-height: 15px;

    color:
        var(--green-dim);

    font-size: 12px;

}


.details-preview {

    margin-top: 4px;

    color: #667a6c;

    font-size: 12px;

    line-height: 1.3;

}


/* ==================================================
   TASK BUTTONS
   ================================================== */

.task-action {

    width: 32px;

    height: 32px;

    min-width: 32px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 0;

    background: transparent;

    border: none;

    border-radius: 50%;

    color: #52675a;

    cursor: pointer;

    font-size: 17px;

}


.task-action:active {

    background:
        rgba(85, 214, 138, 0.12);

    color:
        var(--green);

}


.delete {

    color: #405247;

    font-size: 21px;

}


.delete:active {

    background:
        rgba(216, 107, 107, 0.10);

    color:
        var(--danger);

}


/* ==================================================
   DRAG HANDLE
   ================================================== */

.drag-handle {

    width: 22px;

    min-width: 22px;

    color: #405247;

    font-size: 15px;

    text-align: center;

    cursor: grab;

    user-select: none;

    -webkit-user-select: none;

}


.drag-handle:active {

    color: var(--green);

    cursor: grabbing;

}


/* ==================================================
   SCHEDULE PANEL
   ================================================== */

.schedule-panel {

    display: none;

    margin-top: 5px;

    padding: 12px;

    background:
        var(--panel);

    border:
        1px solid var(--border);

    border-radius: 12px;

    box-shadow:
        var(--glow);

}


.schedule-panel.open {

    display: block;

}


.schedule-title {

    margin-bottom: 9px;

    color: var(--muted);

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 0.6px;

}


.schedule-options {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

}


.day-button {

    min-height: 36px;

    padding:
        7px 11px;

    border:
        1px solid
        rgba(85, 214, 138, 0.14);

    border-radius: 9px;

    background:
        rgba(85, 214, 138, 0.04);

    color: var(--muted);

    font-size: 13px;

    cursor: pointer;

}


.day-button.selected {

    background:
        rgba(85, 214, 138, 0.16);

    border-color:
        var(--green-dim);

    color:
        var(--green);

}


.day-button:active {

    transform: scale(0.97);

}


/* ==================================================
   TOGGLE
   ================================================== */

.toggle-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

}


.toggle-label {

    color: var(--muted);

    font-size: 14px;

}


.toggle {

    position: relative;

    width: 48px;

    height: 28px;

    flex-shrink: 0;

}


.toggle input {

    opacity: 0;

    width: 0;

    height: 0;

}


.toggle-slider {

    position: absolute;

    inset: 0;

    border-radius: 20px;

    background:
        #1a2b20;

    border:
        1px solid
        rgba(85, 214, 138, 0.18);

    cursor: pointer;

    transition:
        background 0.15s ease;

}


.toggle-slider::before {

    content: "";

    position: absolute;

    width: 20px;

    height: 20px;

    left: 3px;

    top: 3px;

    border-radius: 50%;

    background:
        #789080;

    transition:
        transform 0.15s ease,
        background 0.15s ease;

}


.toggle input:checked
+ .toggle-slider {

    background:
        rgba(85, 214, 138, 0.20);

    border-color:
        var(--green-dim);

}


.toggle input:checked
+ .toggle-slider::before {

    transform:
        translateX(20px);

    background:
        var(--green);

    box-shadow:
        0 0 10px
        rgba(85, 214, 138, 0.3);

}


/* ==================================================
   ADD BUTTON
   ================================================== */

.controls {

    display: flex;

    justify-content: center;

    margin-top: 18px;

}


.add-button {

    min-height: 46px;

    padding:
        10px 18px;

    border-radius: 12px;

    border:
        1px solid var(--border);

    background:
        rgba(85, 214, 138, 0.07);

    color:
        var(--green);

    font-size: 15px;

    cursor: pointer;

}


.add-button:active {

    background:
        rgba(85, 214, 138, 0.16);

    transform: scale(0.98);

}


/* ==================================================
   SETTINGS
   ================================================== */

.settings {

    margin-top: 27px;

    padding-top: 17px;

    border-top:
        1px solid
        rgba(85, 214, 138, 0.08);

    text-align: center;

}


.settings button {

    min-height: 40px;

    padding:
        8px 14px;

    background: none;

    border: none;

    color: #52675a;

    font-size: 13px;

}


/* ==================================================
   EMPTY
   ================================================== */

.empty {

    text-align: center;

    color: var(--muted);

    padding:
        28px 20px;

    border:
        1px dashed var(--border);

    border-radius: 14px;

    line-height: 1.5;

}


/* ==================================================
   EDIT MODAL
   ================================================== */

.modal-backdrop {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: flex-end;

    justify-content: center;

    padding:

        18px

        18px

        max(
            18px,
            env(safe-area-inset-bottom)
        );

    background:
        rgba(0, 0, 0, 0.68);

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

}


.modal-backdrop.open {

    display: flex;

}


.modal {

    width: 100%;

    max-width: 600px;

    max-height: 90vh;

    overflow-y: auto;

    background:
        #0d1a12;

    border:
        1px solid
        rgba(85, 214, 138, 0.22);

    border-radius: 20px;

    padding:
        20px;

    box-shadow:

        0 0 30px
        rgba(85, 214, 138, 0.15),

        0 -10px 50px
        rgba(0, 0, 0, 0.4);

    animation:
        modalIn 0.18s ease-out;

}


@keyframes modalIn {

    from {

        transform:
            translateY(20px);

        opacity: 0;

    }

    to {

        transform:
            translateY(0);

        opacity: 1;

    }

}


.modal-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;

}


.modal-title {

    margin: 0;

    font-size: 21px;

    font-weight: 600;

}


.modal-close {

    width: 36px;

    height: 36px;

    border: none;

    border-radius: 50%;

    background:
        rgba(85, 214, 138, 0.06);

    color:
        var(--muted);

    font-size: 23px;

    line-height: 1;

}


.modal-close:active {

    background:
        rgba(85, 214, 138, 0.15);

    color:
        var(--green);

}


.form-group {

    margin-bottom: 16px;

}


.form-label {

    display: block;

    margin-bottom: 7px;

    color:
        var(--muted);

    font-size: 13px;

}


.form-input,
.form-textarea {

    width: 100%;

    border:
        1px solid
        rgba(85, 214, 138, 0.18);

    border-radius: 11px;

    background:
        #07100b;

    color:
        var(--text);

    font-family: inherit;

    font-size: 16px;

    outline: none;

}


.form-input {

    height: 48px;

    padding:
        0 13px;

}


.form-textarea {

    min-height: 100px;

    resize: vertical;

    padding:
        12px 13px;

    line-height: 1.45;

}


.form-input:focus,
.form-textarea:focus {

    border-color:
        var(--green-dim);

    box-shadow:
        0 0 12px
        rgba(85, 214, 138, 0.12);

}


/* ==================================================
   COMPLETION TIME EDITOR
   ================================================== */

.time-edit-row {

    display: flex;

    gap: 8px;

}


.time-edit-row input {

    flex: 1;

}


.time-edit-button {

    min-width: 90px;

    border-radius: 10px;

    border:
        1px solid var(--border);

    background:
        rgba(85, 214, 138, 0.06);

    color:
        var(--green);

    font-size: 13px;

}


/* ==================================================
   MODAL ACTIONS
   ================================================== */

.modal-actions {

    display: flex;

    gap: 10px;

    margin-top: 20px;

}


.modal-button {

    flex: 1;

    min-height: 48px;

    border-radius: 11px;

    font-size: 15px;

    font-weight: 500;

}


.modal-cancel {

    background:
        rgba(85, 214, 138, 0.05);

    border:
        1px solid var(--border);

    color:
        var(--muted);

}


.modal-save {

    background:
        rgba(85, 214, 138, 0.15);

    border:
        1px solid var(--green-dim);

    color:
        var(--green-bright);

}


.modal-button:active {

    transform:
        scale(0.98);

}


/* ==================================================
   SMALL IPHONES
   ================================================== */

@media (max-width: 375px) {

    .app {

        padding-left:
            max(
                14px,
                env(safe-area-inset-left)
            );

        padding-right:
            max(
                14px,
                env(safe-area-inset-right)
            );

    }


    h1 {

        font-size: 27px;

    }


    .item {

        min-height: 64px;

        gap: 8px;

    }


    .item-name {

        font-size: 16px;

    }


    .checkbox {

        width: 28px;

        height: 28px;

        min-width: 28px;

    }


    .task-action {

        width: 30px;

        height: 30px;

        min-width: 30px;

    }

}


/* ==================================================
   DESKTOP
   ================================================== */

@media (min-width: 700px) {

    .app {

        padding-top: 50px;

        padding-left: 20px;

        padding-right: 20px;

    }


    h1 {

        font-size: 32px;

    }


    .item {

        padding:
            17px
            10px
            17px
            18px;

    }


    .item:hover {

        background:
            #112219;

        border-color:
            rgba(85, 214, 138, 0.30);

        box-shadow:
            var(--glow);

    }

}

</style>

</head>


<body>


<div class="app">


<header>

    <div class="flame">✦</div>

    <h1>NovaVesta</h1>

    <div
        class="date"
        id="date"
    ></div>

</header>


<div
    class="progress"
    id="progress"
></div>


<main
    id="sections"
></main>


<div class="controls">

    <button
        class="add-button"
        onclick="addItem()"
    >
        + Add routine item
    </button>

</div>


<div class="settings">

    <button
        onclick="resetToday()"
    >
        Reset today's checklist
    </button>

</div>


</div>


<!-- ==================================================
     EDIT TASK MODAL
     ================================================== -->

<div
    class="modal-backdrop"
    id="editModal"
    onclick="handleBackdropClick(event)"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >

        <div class="modal-header">

            <h2
                class="modal-title"
                id="modalTitle"
            >
                Edit Task
            </h2>

            <button
                class="modal-close"
                onclick="closeEditModal()"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="editTaskName"
            >
                Task name
            </label>

            <input
                class="form-input"
                id="editTaskName"
                type="text"
                autocomplete="off"
            >

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="editTaskDetails"
            >
                Details
            </label>

            <textarea
                class="form-textarea"
                id="editTaskDetails"
                placeholder="Optional notes about this task..."
            ></textarea>

        </div>


        <div class="form-group">

            <div class="toggle-row">

                <span class="toggle-label">
                    Recurring task
                </span>

                <label class="toggle">

                    <input
                        type="checkbox"
                        id="editTaskRecurring"
                    >

                    <span class="toggle-slider"></span>

                </label>

            </div>

        </div>


        <div
            class="form-group"
            id="scheduleGroup"
        >

            <label class="form-label">
                Repeat on
            </label>

            <div
                class="schedule-options"
                id="editScheduleOptions"
            ></div>

        </div>


        <div
            class="form-group"
            id="completionTimeGroup"
        >

            <label
                class="form-label"
                for="editCompletionTime"
            >
                Completion time
            </label>

            <input
                class="form-input"
                id="editCompletionTime"
                type="time"
            >

        </div>


        <div class="modal-actions">

            <button
                class="modal-button modal-cancel"
                onclick="closeEditModal()"
            >
                Cancel
            </button>

            <button
                class="modal-button modal-save"
                onclick="saveEditModal()"
            >
                Save
            </button>

        </div>

    </div>

</div>


<script>

/* ==================================================
   STORAGE
   ================================================== */

const STORAGE_KEY =
    "novavesta-morning-routine";


const DEFAULT_ITEMS = [

    "Get dressed",

    "Brush teeth",

    "Take medications / vitamins",

    "Eat breakfast",

    "Pack everything I need",

    "Check today's schedule",

    "Leave for the day"

];


let data =
    loadData();


let editingItemId =
    null;


/* ==================================================
   TIME OF DAY
   ================================================== */

const TIME_SECTIONS = [

    {
        id: "morning",
        label: "Morning",
        start: 0
    },

    {
        id: "afternoon",
        label: "Afternoon",
        start: 12
    },

    {
        id: "evening",
        label: "Evening",
        start: 17
    }

];


function getCurrentTimeSection() {

    const hour =
        new Date().getHours();


    if (hour >= 17) {

        return "evening";

    }


    if (hour >= 12) {

        return "afternoon";

    }


    return "morning";

}


/* ==================================================
   DATE
   ================================================== */

function todayKey() {

    const now =
        new Date();


    return [

        now.getFullYear(),

        String(
            now.getMonth() + 1
        ).padStart(2, "0"),

        String(
            now.getDate()
        ).padStart(2, "0")

    ].join("-");

}


function currentDay() {

    return new Date().getDay();

}


/* ==================================================
   TIME
   ================================================== */

function timeToMinutes(
    time
) {

    if (!time) {

        return 0;

    }


    const parts =
        time.split(":");


    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );

}


/* ==================================================
   LOAD DATA
   ================================================== */

function loadData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (saved) {

        try {

            const parsed =
                JSON.parse(saved);


            if (
                parsed &&
                Array.isArray(
                    parsed.items
                )
            ) {

                parsed.items.forEach(
                    item => {

                        if (
                            typeof item.completed !==
                            "boolean"
                        ) {

                            item.completed =
                                false;

                        }


                        if (
                            typeof item.completedAt ===
                            "undefined"
                        ) {

                            item.completedAt =
                                null;

                        }


                        if (
                            typeof item.snoozed !==
                            "boolean"
                        ) {

                            item.snoozed =
                                false;

                        }


                        if (
                            typeof item.snoozedUntil ===
                            "undefined"
                        ) {

                            item.snoozedUntil =
                                null;

                        }


                        if (
                            typeof item.details !==
                            "string"
                        ) {

                            item.details =
                                "";

                        }


                        if (
                            !Array.isArray(
                                item.schedule
                            )
                        ) {

                            item.schedule =
                                ["everyday"];

                        }


                        if (
                            typeof item.recurring !==
                            "boolean"
                        ) {

                            item.recurring =
                                true;

                        }


                        if (
                            typeof item.timeOfDay !==
                            "string"
                        ) {

                            item.timeOfDay =
                                getCurrentTimeSection();

                        }


                        if (
                            typeof item.createdDate !==
                            "string"
                        ) {

                            item.createdDate =
                                todayKey();

                        }


                        if (
                            typeof item.order !==
                            "number"
                        ) {

                            item.order =
                                0;

                        }

                    }
                );


                if (
                    !parsed.date
                ) {

                    parsed.date =
                        todayKey();

                }


                if (
                    !parsed.collapsed ||
                    typeof parsed.collapsed !==
                    "object"
                ) {

                    parsed.collapsed = {

                        morning: false,

                        afternoon: true,

                        evening: true

                    };

                }


                return parsed;

            }

        } catch (error) {

            console.error(
                "NovaVesta could not read saved data:",
                error
            );

        }

    }


    return {

        date:
            todayKey(),

        collapsed: {

            morning: false,

            afternoon: true,

            evening: true

        },

        items:
            DEFAULT_ITEMS.map(
                (
                    text,
                    index
                ) => ({

                    id:
                        createId(),

                    text:
                        text,

                    details:
                        "",

                    completed:
                        false,

                    completedAt:
                        null,

                    snoozed:
                        false,

                    snoozedUntil:
                        null,

                    schedule:
                        ["everyday"],

                    recurring:
                        true,

                    timeOfDay:
                        "morning",

                    createdDate:
                        todayKey(),

                    order:
                        index

                })
            )

    };

}


/* ==================================================
   ID
   ================================================== */

function createId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();

    }


    return (

        Date.now().toString(36) +

        Math.random()
            .toString(36)
            .substring(2)

    );

}


/* ==================================================
   SAVE
   ================================================== */

function saveData() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(data)

    );

}


/* ==================================================
   MIDNIGHT RESET
   ================================================== */

function checkForNewDay() {

    const today =
        todayKey();


    if (
        data.date === today
    ) {

        return;

    }


    data.date =
        today;


    data.items =
        data.items.filter(
            item =>
                item.recurring !== false
        );


    data.items.forEach(
        item => {

            item.completed =
                false;

            item.completedAt =
                null;

            item.snoozed =
                false;

            item.snoozedUntil =
                null;

        }
    );


    saveData();

}


/* ==================================================
   SCHEDULE
   ================================================== */

function isScheduledToday(
    item
) {

    if (
        item.recurring === false
    ) {

        return (
            item.createdDate ===
            todayKey()
        );

    }


    if (
        !Array.isArray(
            item.schedule
        ) ||
        item.schedule.length === 0
    ) {

        return true;

    }


    if (
        item.schedule.includes(
            "everyday"
        )
    ) {

        return true;

    }


    return item.schedule.includes(
        currentDay()
    );

}


/* ==================================================
   VISIBLE ITEMS
   ================================================== */

function getVisibleItems() {

    return data.items.filter(

        item =>

            isScheduledToday(item) &&

            !item.snoozed

    );

}


/* ==================================================
   ORDER
   ================================================== */

function getSectionItems(
    sectionId
) {

    return getVisibleItems()

        .filter(
            item =>
                item.timeOfDay ===
                sectionId
        )

        .sort(
            (
                a,
                b
            ) => {

                return (
                    (a.order || 0) -
                    (b.order || 0)
                );

            }
        );

}


/* ==================================================
   RENDER
   ================================================== */

function render() {

    checkForNewDay();


    const sections =
        document.getElementById(
            "sections"
        );


    sections.innerHTML =
        "";


    const current =
        getCurrentTimeSection();


    /*
     * Current time-of-day section always
     * appears first.
     *
     * The remaining sections follow in
     * chronological order.
     */

    const orderedSections =
        TIME_SECTIONS.slice()
            .sort(
                (
                    a,
                    b
                ) => {

                    if (
                        a.id === current
                    ) {

                        return -1;

                    }

                    if (
                        b.id === current
                    ) {

                        return 1;

                    }

                    return (
                        a.start -
                        b.start
                    );

                }
            );


    orderedSections.forEach(
        section => {

            renderSection(
                section,
                sections
            );

        }
    );


    updateProgress();

}


/* ==================================================
   RENDER SECTION
   ================================================== */

function renderSection(
    section,
    container
) {

    const sectionElement =
        document.createElement(
            "section"
        );


    sectionElement.className =
        "time-section";


    if (
        data.collapsed &&
        data.collapsed[
            section.id
        ]
    ) {

        sectionElement.classList.add(
            "collapsed"
        );

    }


    const heading =
        document.createElement(
            "button"
        );


    heading.className =
        "time-heading";


    heading.type =
        "button";


    heading.onclick =
        () => toggleSection(
            section.id
        );


    heading.innerHTML = `

        <span class="time-heading-left">

            <span class="time-heading-arrow">
                ▼
            </span>

            <span>
                ${section.label}
            </span>

        </span>

    `;


    sectionElement.appendChild(
        heading
    );


    const content =
        document.createElement(
            "div"
        );


    content.className =
        "time-section-content";


    const routine =
        document.createElement(
            "div"
        );


    routine.className =
        "routine";


    routine.dataset.section =
        section.id;


    const items =
        getSectionItems(
            section.id
        );


    if (
        items.length === 0
    ) {

        routine.innerHTML = `

            <div class="empty">

                No tasks scheduled.

            </div>

        `;

    } else {

        items.forEach(
            item => {

                renderItem(
                    item,
                    routine
                );

            }
        );

    }


    content.appendChild(
        routine
    );


    sectionElement.appendChild(
        content
    );


    container.appendChild(
        sectionElement
    );

}


/* ==================================================
   RENDER TASK
   ================================================== */

function renderItem(

    routine
) {

    const wrapper =

        );


    wrapper.className =

    wrapper.dataset.id =

        >
            ⋮⋮
        </div>

        >

            }

            title="Change schedule"

        >

        </button>


        <button

            title="Snooze until tomorrow"
            aria-label="Snooze until tomorrow"
        >
            ◷
        </button>


        <button
            class="task-action delete"
            data-action="delete"
            title="Delete permanently"
            aria-label="Delete permanently"
        >
            ×
        </button>

    `;


    const checkbox =

            ".checkbox"
        );


    checkbox.addEventListener(
        "change",

    const name =

    name.addEventListener(

        )

    element

        .addEventListener(

            () => toggleSchedulePanel(

            )
        );


    element
        .querySelector(
            '[data-action="snooze"]'
        )
        .addEventListener(
            "click",
            () => snoozeItem(
                item.id

    element
        .querySelector(
            '[data-action="delete"]'
        )
        .addEventListener(
            "click",
            () => deleteItem(
                item.id
            )
        );


    const schedulePanel =
        document.createElement(
            "div"
        );


    schedulePanel.className =
        "schedule-panel";


    schedulePanel.id =
        "schedule-" +

    schedulePanel.innerHTML =

        );


    wrapper.appendChild(

    );


    wrapper.appendChild(

    );

    );

    );

}

        },

            value: 3,

        },

        },

        },

        }

/* ==================================================
   SCHEDULE PANEL
   ================================================== */

function toggleSchedulePanel(
    id
) {

    const panel =
        document.getElementById(
            "schedule-" + id
        );


    if (!panel) {

        return;

    }


    const wasOpen =
        panel.classList.contains(
            "open"
        );


    document
        .querySelectorAll(
            ".schedule-panel"
        )
        .forEach(
            other => {

                other.classList.remove(
                    "open"
                );

            }
        );


    if (!wasOpen) {

        panel.classList.add(
            "open"
        );

    }

}


/* ==================================================
   CHANGE SCHEDULE
   ================================================== */

function toggleSchedule(
    id,
    value
) {

    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item || !item.recurring) {

        return;

    }


    if (
        value !== "everyday"
    ) {

        value =
            Number(value);

    }


    if (
        value === "everyday"
    ) {

        item.schedule =
            ["everyday"];

    } else {

        if (
            item.schedule.includes(
                "everyday"
            )
        ) {

            item.schedule =
                [value];

        } else if (
            item.schedule.includes(
                value
            )
        ) {

            item.schedule =
                item.schedule.filter(
                    day =>
                        day !== value
                );

        } else {

            item.schedule.push(
                value
            );

        }


        if (
            item.schedule.length === 0
        ) {

            item.schedule =
                ["everyday"];

        }

    }


    saveData();


    const panel =
        document.getElementById(
            "schedule-" + id
        );


    if (panel) {

        panel.innerHTML =
            createSchedulePicker(
                item
            );

        panel.classList.add(
            "open"
        );

    }

}


/* ==================================================
   COMPLETE
   ================================================== */

function toggleItem(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    if (
        item.completed
    ) {

        item.completed =
            false;

        item.completedAt =
            null;

    } else {

        item.completed =
            true;

        item.completedAt =
            getCurrentTimeValue();

    }


    saveData();

    render();

}


/* ==================================================
   CURRENT TIME VALUE
   ================================================== */

function getCurrentTimeValue() {

    const now =
        new Date();


    return (

        String(
            now.getHours()
        ).padStart(2, "0") +

        ":" +

        String(
            now.getMinutes()
        ).padStart(2, "0")

    );

}


/* ==================================================
   FORMAT COMPLETION TIME
   ================================================== */

function formatCompletionTime(
    value
) {

    if (!value) {

        return "";

    }


    if (
        value.includes(
            "AM"
        ) ||
        value.includes(
            "PM"
        )
    ) {

        return value;

    }


    const parts =
        value.split(":");


    if (
        parts.length !== 2
    ) {

        return value;

    }


    const hour =
        Number(parts[0]);


    const minute =
        parts[1];


    const suffix =
        hour >= 12
        ? "PM"
        : "AM";


    const displayHour =
        hour % 12 || 12;


    return (
        displayHour +
        ":" +
        minute +
        " " +
        suffix
    );

}


/* ==================================================
   SNOOZE
   ================================================== */

function snoozeItem(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    item.snoozed =
        true;


    item.snoozedUntil =
        todayKey();


    saveData();

    render();

}


/* ==================================================

function openEditModal(

    );

/* ==================================================
   EDIT SCHEDULE BUTTON
   ================================================== */

function toggleEditScheduleButton(
    button
) {

    const value =
        button.dataset.day;


    const buttons =
        document
            .getElementById(
                "editScheduleOptions"
            )
            .querySelectorAll(
                ".day-button"
            );


    if (
        value === "everyday"
    ) {

        buttons.forEach(
            b =>
                b.classList.remove(
                    "selected"
                )
        );

        button.classList.add(
            "selected"
        );

        return;

    }


    const everyday =
        document.querySelector(
            '#editScheduleOptions .day-button[data-day="everyday"]'
        );


    everyday.classList.remove(
        "selected"
    );


    button.classList.toggle(
        "selected"
    );


    const selected =
        Array.from(
            buttons
        ).filter(
            b =>
                b.classList.contains(
                    "selected"
                )
        );


    if (
        selected.length === 0
    ) {

        everyday.classList.add(
            "selected"
        );

    }

}


/* ==================================================
   UPDATE EDIT VISIBILITY
   ================================================== */

function updateEditScheduleVisibility() {

    const recurring =
        document.getElementById(
            "editTaskRecurring"
        ).checked;


    document.getElementById(
        "scheduleGroup"
    ).style.display =
        recurring
        ? "block"
        : "none";

}


/* ==================================================
   SAVE EDIT
   ================================================== */

function saveEditModal() {

    if (
        !editingItemId
    ) {

        return;

    }


    const item =
        data.items.find(
            item =>
                item.id ===
                editingItemId
        );


    if (!item) {

        closeEditModal();

        return;

    }


    const nameInput =
        document.getElementById(
            "editTaskName"
        );


    const detailsInput =
        document.getElementById(
            "editTaskDetails"
        );


    const recurringInput =
        document.getElementById(
            "editTaskRecurring"
        );


    const completionInput =
        document.getElementById(
            "editCompletionTime"
        );


    const newName =
        nameInput.value.trim();


    if (
        newName === ""
    ) {

        nameInput.focus();

        return;

    }


    item.text =
        newName;


    item.details =
        detailsInput.value.trim();


    item.recurring =
        recurringInput.checked;


    if (
        item.recurring
    ) {

        const selectedButtons =
            Array.from(
                document
                    .getElementById(
                        "editScheduleOptions"
                    )
                    .querySelectorAll(
                        ".day-button.selected"
                    )
            );


        const schedule =
            selectedButtons.map(
                button => {

                    const value =
                        button.dataset.day;


                    return (
                        value === "everyday"
                        ? "everyday"
                        : Number(value)
                    );

                }
            );


        item.schedule =
            schedule.length
            ? schedule
            : ["everyday"];

    } else {

        /*
         * One-time tasks are only valid
         * for the current calendar day.
         */

        item.createdDate =
            todayKey();

    }


    if (
        item.completed
    ) {

        item.completedAt =
            completionInput.value ||
            item.completedAt ||
            getCurrentTimeValue();

    }


    saveData();

    closeEditModal();

    render();

}


/* ==================================================
   RECURRING TOGGLE
   ================================================== */

document
    .getElementById(
        "editTaskRecurring"
    )
    .addEventListener(
        "change",
        updateEditScheduleVisibility
    );

   CLOSE EDIT MODAL

function closeEditModal() {

    const modal =
        document.getElementById(
            "editModal"
        );


    modal.classList.remove(
        "open"
    );


    editingItemId =
        null;

}


/* ==================================================
   TAP OUTSIDE MODAL
   ================================================== */

function handleBackdropClick(
    event
) {

    if (
        event.target.id ===
        "editModal"
    ) {

        closeEditModal();

    }

}


/* ==================================================
   ADD TASK
   ================================================== */

function addItem() {

    checkForNewDay();


    const newItem = {

        id:
            createId(),

        text:
            "",

        details:
            "",

        completed:
            false,

        completedAt:
            null,

        snoozed:
            false,

        snoozedUntil:
            null,

        schedule:
            ["everyday"],

        recurring:
            true,

        timeOfDay:
            getCurrentTimeSection(),

        createdDate:
            todayKey(),

        order:
            getNextOrder(
                getCurrentTimeSection()
            )

    };


    data.items.push(
        newItem
    );


    saveData();

    render();


    openEditModal(
        newItem.id
    );


    setTimeout(
        () => {

            document
                .getElementById(
                    "editTaskName"
                )
                .focus();

        },
        150
    );

}


/* ==================================================
   NEXT ORDER
   ================================================== */

function getNextOrder(
    sectionId
) {

    const items =
        data.items.filter(
            item =>
                item.timeOfDay ===
                sectionId
        );


    if (
        items.length === 0
    ) {

        return 0;

    }


    return Math.max(
        ...items.map(
            item =>
                item.order || 0
        )
    ) + 1;

}


/* ==================================================
   DELETE TASK
   ================================================== */

function deleteItem(
    id
) {

    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    data.items =
        data.items.filter(
            item =>
                item.id !== id
        );


    saveData();

    render();

}


/* ==================================================
   COLLAPSE SECTIONS
   ================================================== */

function toggleSection(
    sectionId
) {

    if (
        !data.collapsed
    ) {

        data.collapsed = {};

    }


    data.collapsed[
        sectionId
    ] =
        !data.collapsed[
            sectionId
        ];


    saveData();

    render();

}


/* ==================================================
   PROGRESS
   ================================================== */

function updateProgress() {

    const visibleItems =
        getVisibleItems();


    const total =
        visibleItems.length;


    const completed =
        visibleItems.filter(
            item =>
                item.completed
        ).length;


    const progress =
        document.getElementById(
            "progress"
        );


    if (
        total === 0
    ) {

        progress.innerHTML =
            "";

        return;

    }


    progress.innerHTML =

        `<strong>${completed}</strong>
         of ${total} completed`;

}


/* ==================================================
   RESET TODAY
   ================================================== */

function resetToday() {

    checkForNewDay();


    if (
        !confirm(
            "Reset all of today's completed and snoozed items?"
        )
    ) {

        return;

    }


    data.items.forEach(
        item => {

            item.completed =
                false;

            item.completedAt =
                null;

            item.snoozed =
                false;

            item.snoozedUntil =
                null;

        }
    );


    saveData();

    render();

}


/* ==================================================
   DATE DISPLAY
   ================================================== */

function updateDate() {

    const date =
        new Date();


    document.getElementById(
        "date"
    ).textContent =

        date.toLocaleDateString(
            [],
            {
                weekday:
                    "long",

                month:
                    "long",

                day:
                    "numeric"
            }
        );

}


/* ==================================================
   ESCAPE HTML
   ================================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* ==================================================
   DRAG AND DROP
   ================================================== */

let dragState =
    null;


function setupDragBehavior(
    wrapper,
    routine,
    itemId
) {

    const handle =
        wrapper.querySelector(
            ".drag-handle"
        );


    if (!handle) {

        return;

    }


    let pressTimer =
        null;


    let startY =
        0;


    let dragging =
        false;


    handle.addEventListener(
        "touchstart",
        event => {

            if (
                event.touches.length !== 1
            ) {

                return;

            }


            startY =
                event.touches[0].clientY;


            pressTimer =
                setTimeout(
                    () => {

                        dragging =
                            true;


                        wrapper
                            .querySelector(
                                ".item"
                            )
                            .classList.add(
                                "dragging"
                            );


                        dragState = {

                            wrapper,
                            routine,
                            itemId

                        };

                    },
                    350
                );

        },
        {
            passive: true
        }
    );


    handle.addEventListener(
        "touchmove",
        event => {

            if (!dragging) {

                return;

            }


            event.preventDefault();


            const touch =
                event.touches[0];


            const target =
                document.elementFromPoint(
                    touch.clientX,
                    touch.clientY
                );


            const targetWrapper =
                target
                ? target.closest(
                    ".task-wrapper"
                )
                : null;


            if (
                !targetWrapper ||
                targetWrapper === wrapper ||
                targetWrapper.parentElement !==
                    routine
            ) {

                return;

            }


            const rect =
                targetWrapper.getBoundingClientRect();


            if (
                touch.clientY <
                rect.top +
                rect.height / 2
            ) {

                routine.insertBefore(
                    wrapper,
                    targetWrapper
                );

            } else {

                routine.insertBefore(
                    wrapper,
                    targetWrapper.nextSibling
                );

            }

        },
        {
            passive: false
        }
    );


    handle.addEventListener(
        "touchend",
        () => {

            clearTimeout(
                pressTimer
            );


            if (
                dragging
            ) {

                dragging =
                    false;


                wrapper
                    .querySelector(
                        ".item"
                    )
                    .classList.remove(
                        "dragging"
                    );


                saveRoutineOrder(
                    routine
                );

                dragState =
                    null;

            }

        }
    );


    handle.addEventListener(
        "touchcancel",
        () => {

            clearTimeout(
                pressTimer
            );


            if (
                dragging
            ) {

                dragging =
                    false;


                wrapper
                    .querySelector(
                        ".item"
                    )
                    .classList.remove(
                        "dragging"
                    );


                render();

                dragState =
                    null;

            }

        }
    );


    /*
     * Desktop drag support.
     */

    handle.draggable =
        true;


    handle.addEventListener(
        "dragstart",
        event => {

            dragging =
                true;


            wrapper
                .querySelector(
                    ".item"
                )
                .classList.add(
                    "dragging"
                );


            dragState = {

                wrapper,
                routine,
                itemId

            };


            event.dataTransfer.effectAllowed =
                "move";

        }
    );


    wrapper.addEventListener(
        "dragover",
        event => {

            if (
                !dragging ||
                !dragState ||
                dragState.routine !==
                    routine
            ) {

                return;

            }


            event.preventDefault();


            const rect =
                wrapper.getBoundingClientRect();


            if (
                event.clientY <
                rect.top +
                rect.height / 2
            ) {

                routine.insertBefore(
                    dragState.wrapper,
                    wrapper
                );

            } else {

                routine.insertBefore(
                    dragState.wrapper,
                    wrapper.nextSibling
                );

            }

        }
    );


    handle.addEventListener(
        "dragend",
        () => {

            if (
                dragging
            ) {

                dragging =
                    false;

                wrapper
                    .querySelector(
                        ".item"
                    )
                    .classList.remove(
                        "dragging"
                    );

                saveRoutineOrder(
                    routine
                );

                dragState =
                    null;

            }

        }
    );

}


function saveRoutineOrder(
    routine
) {

    const sectionId =
        routine.dataset.section;


    const wrappers =
        Array.from(
            routine.querySelectorAll(
                ".task-wrapper"
            )
        );


    wrappers.forEach(
        (
            wrapper,
            index
        ) => {

            const item =
                data.items.find(
                    item =>
                        item.id ===
                        wrapper.dataset.id
                );


            if (item) {

                item.order =
                    index;

                item.timeOfDay =
                    sectionId;

            }

        }
    );


    saveData();

}


/* ==================================================
   AUTO REFRESH
   ================================================== */

/*
 * We check periodically so that if NovaVesta
 * remains open across noon, 5 PM, or midnight,
 * it updates without requiring a reload.
 */

setInterval(
    () => {

        const oldDate =
            data.date;


        const oldSection =
            getCurrentTimeSection();


        checkForNewDay();


        const newSection =
            getCurrentTimeSection();


        if (
            oldDate !== data.date ||
            oldSection !== newSection
        ) {

            updateDate();

            render();

        }

    },
    30000
);


/* ==================================================
   START
   ================================================== */

checkForNewDay();

updateDate();

render();

</script>
