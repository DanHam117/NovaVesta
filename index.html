<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="NovaVesta"
>

<meta
    name="theme-color"
    content="#07100b"
>

<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<title>NovaVesta</title>


<style>

/* ==================================================
   NOVAVESTA
   ================================================== */

:root {

    --bg: #07100b;
    --panel: #0d1a12;
    --panel-active: #102319;
    --green: #55d68a;
    --green-bright: #7affad;
    --green-dim: #347a50;
    --text: #edf8f0;
    --muted: #789080;
    --border: rgba(85, 214, 138, 0.17);
    --danger: #d86b6b;

    --glow:
        0 0 18px
        rgba(85, 214, 138, 0.18);
}


* {

    box-sizing: border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html {

    background: var(--bg);

    -webkit-text-size-adjust: 100%;

    text-size-adjust: 100%;

    min-height: 100%;

}


body {

    margin: 0;

    min-height: 100vh;

    min-height: 100dvh;

    overflow-x: hidden;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(44, 130, 76, 0.18),
            transparent 45%
        ),

        var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    touch-action: manipulation;

}


/* ==================================================
   APP
   ================================================== */

.app {

    width: 100%;

    max-width: 680px;

    margin: 0 auto;

    padding-top:
        max(22px, env(safe-area-inset-top));

    padding-left:
        max(18px, env(safe-area-inset-left));

    padding-right:
        max(18px, env(safe-area-inset-right));

    padding-bottom:
        calc(
            40px +
            env(safe-area-inset-bottom)
        );

}


/* ==================================================
   HEADER
   ================================================== */

header {

    text-align: center;

    padding-top: 8px;

    margin-bottom: 24px;

}


.flame {

    font-size: 25px;

    color: var(--green-bright);

    text-shadow:
        0 0 15px
        rgba(122, 255, 173, 0.5);

    margin-bottom: 4px;

}


h1 {

    margin: 0;

    font-size: 29px;

    line-height: 1.15;

    font-weight: 600;

    letter-spacing: -0.4px;

}


.date {

    margin-top: 7px;

    color: var(--muted);

    font-size: 14px;

}


/* ==================================================
   PROGRESS
   ================================================== */

.progress {

    text-align: center;

    margin-bottom: 18px;

    color: var(--muted);

    font-size: 14px;

}


.progress strong {

    color: var(--green);

}


/* ==================================================
   TIME OF DAY SECTIONS
   ================================================== */

.time-section {

    margin-bottom: 22px;

}


.time-heading {

    margin:

        0 0 9px 4px;

    color: var(--muted);

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 0.8px;

    text-transform: uppercase;

}


.time-section.current .time-heading {

    color: var(--green);

}


/* ==================================================
   ROUTINE
   ================================================== */

.routine {

    display: flex;

    flex-direction: column;

    gap: 9px;

}


/* ==================================================
   TASK
   ================================================== */

.task-wrapper {

    width: 100%;

    position: relative;

}


.item {

    display: flex;

    align-items: center;

    gap: 10px;

    width: 100%;

    min-height: 68px;

    padding:
        12px
        7px
        12px
        14px;

    background:
        rgba(13, 26, 18, 0.96);

    border:
        1px solid var(--border);

    border-radius: 14px;

    transition:
        background 0.15s ease,
        border-color 0.15s ease,
        opacity 0.15s ease,
        transform 0.12s ease;

    /*
     * Important for iPhone dragging.
     */
    -webkit-user-select: none;
    user-select: none;

    touch-action: pan-y;

}


.item:active {

    background:
        var(--panel-active);

    border-color:
        rgba(85, 214, 138, 0.32);

}


.item.completed {

    opacity: 0.67;

}


/* ==================================================
   DRAGGING
   ================================================== */

.item.dragging {

    position: relative;

    z-index: 100;

    opacity: 0.92;

    transform:
        scale(1.025);

    border-color:
        var(--green);

    box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.45),

        var(--glow);

}


.task-wrapper.drag-placeholder {

    opacity: 0.35;

}


.task-wrapper.drag-placeholder .item {

    border-style: dashed;

}


/* ==================================================
   CHECKBOX
   ================================================== */

.checkbox {

    appearance: none;

    -webkit-appearance: none;

    width: 30px;

    height: 30px;

    min-width: 30px;

    margin: 0;

    border:
        2px solid
        var(--green-dim);

    border-radius: 9px;

    background: transparent;

    position: relative;

    cursor: pointer;

    touch-action: manipulation;

}


.checkbox::before {

    content: "";

    position: absolute;

    inset: -10px;

}


.checkbox:checked {

    background:
        var(--green);

    border-color:
        var(--green);

    box-shadow:
        0 0 14px
        rgba(85, 214, 138, 0.32);

}


.checkbox:checked::after {

    content: "✓";

    position: absolute;

    left: 4px;

    top: -1px;

    color: #07100b;

    font-size: 21px;

    font-weight: 800;

}


/* ==================================================
   TASK CONTENT
   ================================================== */

.item-content {

    flex: 1;

    min-width: 0;

}


.item-name {

    font-size: 17px;

    line-height: 1.3;

    font-weight: 450;

    word-break: break-word;

    cursor: pointer;

}


.item-name:active {

    color: var(--green);

}


.completed .item-name {

    text-decoration: line-through;

    color: #91a598;

}


.timestamp {

    margin-top: 3px;

    min-height: 15px;

    color: var(--green-dim);

    font-size: 12px;

}


.details-preview {

    margin-top: 3px;

    color: #64796c;

    font-size: 12px;

    line-height: 1.3;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* ==================================================
   TASK BUTTONS
   ================================================== */

.task-action {

    width: 32px;

    height: 32px;

    min-width: 32px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 0;

    background: transparent;

    border: none;

    border-radius: 50%;

    color: #52675a;

    cursor: pointer;

    font-size: 17px;

    touch-action: manipulation;

}


.task-action:active {

    background:
        rgba(85, 214, 138, 0.12);

    color: var(--green);

}


.delete {

    color: #405247;

    font-size: 21px;

}


.delete:active {

    background:
        rgba(216, 107, 107, 0.10);

    color: var(--danger);

}


/* ==================================================
   SCHEDULE PANEL
   ================================================== */

.schedule-panel {

    display: none;

    margin-top: 5px;

    padding: 12px;

    background: var(--panel);

    border:
        1px solid var(--border);

    border-radius: 12px;

    box-shadow: var(--glow);

}


.schedule-panel.open {

    display: block;

}


.schedule-title {

    margin-bottom: 9px;

    color: var(--muted);

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 0.6px;

}


.schedule-options {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

}


.day-button {

    min-height: 36px;

    padding:
        7px 11px;

    border:
        1px solid
        rgba(85, 214, 138, 0.14);

    border-radius: 9px;

    background:
        rgba(85, 214, 138, 0.04);

    color: var(--muted);

    font-size: 13px;

    cursor: pointer;

}


.day-button.selected {

    background:
        rgba(85, 214, 138, 0.16);

    border-color:
        var(--green-dim);

    color: var(--green);

}


/* ==================================================
   ADD BUTTON
   ================================================== */

.controls {

    display: flex;

    justify-content: center;

    margin-top: 18px;

}


.add-button {

    min-height: 46px;

    padding:
        10px 18px;

    border-radius: 12px;

    border:
        1px solid var(--border);

    background:
        rgba(85, 214, 138, 0.07);

    color: var(--green);

    font-size: 15px;

    cursor: pointer;

}


.add-button:active {

    background:
        rgba(85, 214, 138, 0.16);

    transform: scale(0.98);

}


/* ==================================================
   EARLIER TODAY
   ================================================== */

.earlier-section {

    margin-top: 28px;

    padding-top: 18px;

    border-top:
        1px solid
        rgba(85, 214, 138, 0.08);

}


.earlier-heading {

    margin:
        0 0 9px 4px;

    color: #52675a;

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 0.8px;

    text-transform: uppercase;

}


/* ==================================================
   SETTINGS
   ================================================== */

.settings {

    margin-top: 27px;

    padding-top: 17px;

    border-top:
        1px solid
        rgba(85, 214, 138, 0.08);

    text-align: center;

}


.settings button {

    min-height: 40px;

    padding:
        8px 14px;

    background: none;

    border: none;

    color: #52675a;

    font-size: 13px;

}


/* ==================================================
   EMPTY
   ================================================== */

.empty {

    text-align: center;

    color: var(--muted);

    padding:
        28px 20px;

    border:
        1px dashed var(--border);

    border-radius: 14px;

    line-height: 1.5;

}


/* ==================================================
   EDIT MODAL
   ================================================== */

.modal-backdrop {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: flex-end;

    justify-content: center;

    padding:
        18px
        18px
        max(
            18px,
            env(safe-area-inset-bottom)
        );

    background:
        rgba(0, 0, 0, 0.68);

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

}


.modal-backdrop.open {

    display: flex;

}


.modal {

    width: 100%;

    max-width: 600px;

    max-height: 90vh;

    overflow-y: auto;

    background: #0d1a12;

    border:
        1px solid
        rgba(85, 214, 138, 0.22);

    border-radius: 20px;

    padding: 20px;

    box-shadow:

        0 0 30px
        rgba(85, 214, 138, 0.15),

        0 -10px 50px
        rgba(0, 0, 0, 0.4);

    animation:
        modalIn 0.18s ease-out;

}


@keyframes modalIn {

    from {

        transform:
            translateY(20px);

        opacity: 0;

    }

    to {

        transform:
            translateY(0);

        opacity: 1;

    }

}


.modal-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;

}


.modal-title {

    margin: 0;

    font-size: 21px;

    font-weight: 600;

}


.modal-close {

    width: 36px;

    height: 36px;

    border: none;

    border-radius: 50%;

    background:
        rgba(85, 214, 138, 0.06);

    color: var(--muted);

    font-size: 23px;

    line-height: 1;

}


.form-group {

    margin-bottom: 16px;

}


.form-label {

    display: block;

    margin-bottom: 7px;

    color: var(--muted);

    font-size: 13px;

}


.form-input,
.form-textarea {

    width: 100%;

    border:
        1px solid
        rgba(85, 214, 138, 0.18);

    border-radius: 11px;

    background: #07100b;

    color: var(--text);

    font-family: inherit;

    font-size: 16px;

    outline: none;

}


.form-input {

    height: 48px;

    padding:
        0 13px;

}


.form-textarea {

    min-height: 100px;

    resize: vertical;

    padding:
        12px 13px;

    line-height: 1.45;

}


.form-input:focus,
.form-textarea:focus {

    border-color:
        var(--green-dim);

    box-shadow:
        0 0 12px
        rgba(85, 214, 138, 0.12);

}


/* ==================================================
   TIME OF DAY PICKER
   ================================================== */

.time-picker {

    display: flex;

    gap: 7px;

}


.time-option {

    flex: 1;

    min-height: 42px;

    border:
        1px solid
        rgba(85, 214, 138, 0.14);

    border-radius: 10px;

    background:
        rgba(85, 214, 138, 0.04);

    color: var(--muted);

    font-size: 13px;

    cursor: pointer;

}


.time-option.selected {

    background:
        rgba(85, 214, 138, 0.16);

    border-color:
        var(--green-dim);

    color: var(--green);

}


.time-option:active {

    transform: scale(0.98);

}


/* ==================================================
   MODAL ACTIONS
   ================================================== */

.modal-actions {

    display: flex;

    gap: 10px;

    margin-top: 20px;

}


.modal-button {

    flex: 1;

    min-height: 48px;

    border-radius: 11px;

    font-size: 15px;

    font-weight: 500;

}


.modal-cancel {

    background:
        rgba(85, 214, 138, 0.05);

    border:
        1px solid var(--border);

    color: var(--muted);

}


.modal-save {

    background:
        rgba(85, 214, 138, 0.15);

    border:
        1px solid var(--green-dim);

    color: var(--green-bright);

}


.modal-button:active {

    transform:
        scale(0.98);

}


/* ==================================================
   SMALL IPHONES
   ================================================== */

@media (max-width: 375px) {

    .app {

        padding-left:
            max(
                14px,
                env(safe-area-inset-left)
            );

        padding-right:
            max(
                14px,
                env(safe-area-inset-right)
            );

    }


    h1 {

        font-size: 27px;

    }


    .item {

        min-height: 64px;

        gap: 8px;

    }


    .item-name {

        font-size: 16px;

    }


    .checkbox {

        width: 28px;

        height: 28px;

        min-width: 28px;

    }


    .task-action {

        width: 30px;

        height: 30px;

        min-width: 30px;

    }

}


/* ==================================================
   DESKTOP
   ================================================== */

@media (min-width: 700px) {

    .app {

        padding-top: 50px;

        padding-left: 20px;

        padding-right: 20px;

    }


    h1 {

        font-size: 32px;

    }


    .item {

        padding:
            17px
            10px
            17px
            18px;

    }


    .item:hover {

        background:
            #112219;

        border-color:
            rgba(85, 214, 138, 0.30);

        box-shadow:
            var(--glow);

    }

}

</style>

</head>


<body>


<div class="app">


<header>

    <div class="flame">✦</div>

    <h1>NovaVesta</h1>

    <div
        class="date"
        id="date"
    ></div>

</header>


<div
    class="progress"
    id="progress"
></div>


<main
    id="routine"
></main>


<div
    class="earlier-section"
    id="earlierSection"
    style="display:none;"
>

    <div class="earlier-heading">
        Earlier today
    </div>

    <div
        class="routine"
        id="earlierRoutine"
    ></div>

</div>


<div class="controls">

    <button
        class="add-button"
        onclick="addItem()"
    >
        + Add routine item
    </button>

</div>


<div class="settings">

    <button
        onclick="resetToday()"
    >
        Reset today's checklist
    </button>

</div>


</div>


<!-- ==================================================
     EDIT MODAL
     ================================================== -->

<div
    class="modal-backdrop"
    id="editModal"
    onclick="handleBackdropClick(event)"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >

        <div class="modal-header">

            <h2
                class="modal-title"
                id="modalTitle"
            >
                Edit Task
            </h2>

            <button
                class="modal-close"
                onclick="closeEditModal()"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="editTaskName"
            >
                Task name
            </label>

            <input
                class="form-input"
                id="editTaskName"
                type="text"
                autocomplete="off"
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                Time of day
            </label>

            <div
                class="time-picker"
                id="timePicker"
            >

                <button
                    type="button"
                    class="time-option"
                    data-time="morning"
                    onclick="selectTimeOfDay('morning')"
                >
                    Morning
                </button>

                <button
                    type="button"
                    class="time-option"
                    data-time="afternoon"
                    onclick="selectTimeOfDay('afternoon')"
                >
                    Afternoon
                </button>

                <button
                    type="button"
                    class="time-option"
                    data-time="night"
                    onclick="selectTimeOfDay('night')"
                >
                    Night
                </button>

            </div>

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="editTaskDetails"
            >
                Details
            </label>

            <textarea
                class="form-textarea"
                id="editTaskDetails"
                placeholder="Optional notes about this task..."
            ></textarea>

        </div>


        <div class="modal-actions">

            <button
                class="modal-button modal-cancel"
                onclick="closeEditModal()"
            >
                Cancel
            </button>

            <button
                class="modal-button modal-save"
                onclick="saveEditModal()"
            >
                Save
            </button>

        </div>

    </div>

</div>


<script>

/* ==================================================
   STORAGE
   ================================================== */

const STORAGE_KEY =
    "novavesta-morning-routine";


const DEFAULT_ITEMS = [

    {
        text: "Get dressed",
        timeOfDay: "morning"
    },

    {
        text: "Brush teeth",
        timeOfDay: "morning"
    },

    {
        text: "Take medications / vitamins",
        timeOfDay: "morning"
    },

    {
        text: "Eat breakfast",
        timeOfDay: "morning"
    },

    {
        text: "Pack everything I need",
        timeOfDay: "morning"
    },

    {
        text: "Check today's schedule",
        timeOfDay: "morning"
    },

    {
        text: "Leave for the day",
        timeOfDay: "morning"
    }

];


let data =
    loadData();


let editingItemId =
    null;


let selectedTimeOfDay =
    "morning";


/* ==================================================
   DATE
   ================================================== */

function todayKey() {

    const now =
        new Date();

    return [

        now.getFullYear(),

        String(
            now.getMonth() + 1
        ).padStart(2, "0"),

        String(
            now.getDate()
        ).padStart(2, "0")

    ].join("-");

}


function currentDay() {

    return new Date().getDay();

}


/* ==================================================
   TIME OF DAY
   ================================================== */

function getCurrentTimeOfDay() {

    const hour =
        new Date().getHours();


    if (
        hour >= 12 &&
        hour < 17
    ) {

        return "afternoon";

    }


    if (
        hour >= 17 ||
        hour < 2
    ) {

        return "night";

    }


    return "morning";

}


function timeOfDayLabel(
    value
) {

    const labels = {

        morning: "Morning",

        afternoon: "Afternoon",

        night: "Night"

    };


    return labels[value] ||
        "Morning";

}


/* ==================================================
   LOAD DATA
   ================================================== */

function loadData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (saved) {

        try {

            const parsed =
                JSON.parse(saved);


            if (
                parsed &&
                Array.isArray(
                    parsed.items
                )
            ) {

                parsed.items.forEach(
                    (item, index) => {

                        if (
                            typeof item.completed !==
                            "boolean"
                        ) {

                            item.completed =
                                false;

                        }


                        if (
                            typeof item.completedAt ===
                            "undefined"
                        ) {

                            item.completedAt =
                                null;

                        }


                        if (
                            typeof item.snoozed !==
                            "boolean"
                        ) {

                            item.snoozed =
                                false;

                        }


                        if (
                            typeof item.snoozedUntil ===
                            "undefined"
                        ) {

                            item.snoozedUntil =
                                null;

                        }


                        if (
                            typeof item.details !==
                            "string"
                        ) {

                            item.details =
                                "";

                        }


                        if (
                            !Array.isArray(
                                item.schedule
                            )
                        ) {

                            item.schedule =
                                ["everyday"];

                        }


                        /*
                         * New property:
                         * permanent time-of-day.
                         *
                         * Existing tasks from older
                         * versions are assigned to
                         * morning so nothing disappears.
                         */

                        if (
                            ![
                                "morning",
                                "afternoon",
                                "night"
                            ].includes(
                                item.timeOfDay
                            )
                        ) {

                            item.timeOfDay =
                                "morning";

                        }


                        if (
                            typeof item.order !==
                            "number"
                        ) {

                            item.order =
                                index;

                        }

                    }
                );


                if (
                    !parsed.date
                ) {

                    parsed.date =
                        todayKey();

                }


                return parsed;

            }

        } catch (error) {

            console.error(
                "NovaVesta could not read saved data:",
                error
            );

        }

    }


    return {

        date:
            todayKey(),

        items:
            DEFAULT_ITEMS.map(
                (item, index) => ({

                    id:
                        createId(),

                    text:
                        item.text,

                    details:
                        "",

                    completed:
                        false,

                    completedAt:
                        null,

                    snoozed:
                        false,

                    snoozedUntil:
                        null,

                    schedule:
                        ["everyday"],

                    timeOfDay:
                        item.timeOfDay,

                    order:
                        index

                })
            )

    };

}


/* ==================================================
   ID
   ================================================== */

function createId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();

    }


    return (

        Date.now().toString(36) +

        Math.random()
            .toString(36)
            .substring(2)

    );

}


/* ==================================================
   SAVE
   ================================================== */

function saveData() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(data)

    );

}


/* ==================================================
   NEW DAY
   ================================================== */

function checkForNewDay() {

    const today =
        todayKey();


    if (
        data.date === today
    ) {

        return;

    }


    data.date =
        today;


    data.items.forEach(
        item => {

            item.completed =
                false;

            item.completedAt =
                null;

            item.snoozed =
                false;

            item.snoozedUntil =
                null;

        }
    );


    saveData();

}


/* ==================================================
   SCHEDULE
   ================================================== */

function isScheduledToday(
    item
) {

    if (
        !Array.isArray(
            item.schedule
        ) ||
        item.schedule.length === 0
    ) {

        return true;

    }


    if (
        item.schedule.includes(
            "everyday"
        )
    ) {

        return true;

    }


    return item.schedule.includes(
        currentDay()
    );

}


/* ==================================================
   SORT
   ================================================== */

function sortItems(
    items
) {

    return [...items].sort(
        (a, b) => {

            return (
                (a.order ?? 0) -
                (b.order ?? 0)
            );

        }
    );

}


/* ==================================================
   VISIBLE ITEMS
   ================================================== */

function getVisibleItems() {

    return sortItems(
        data.items.filter(
            item =>
                isScheduledToday(item) &&
                !item.snoozed
        )
    );

}


/* ==================================================
   RENDER
   ================================================== */

function render() {

    checkForNewDay();


    const routine =
        document.getElementById(
            "routine"
        );


    routine.innerHTML =
        "";


    const visibleItems =
        getVisibleItems();


    const groups = {

        morning:
            visibleItems.filter(
                item =>
                    item.timeOfDay ===
                    "morning"
            ),

        afternoon:
            visibleItems.filter(
                item =>
                    item.timeOfDay ===
                    "afternoon"
            ),

        night:
            visibleItems.filter(
                item =>
                    item.timeOfDay ===
                    "night"
            )

    };


    const current =
        getCurrentTimeOfDay();


    /*
     * Sections are always displayed in
     * chronological order, but the current
     * section is moved to the top.
     */

    const order = [

        current,

        ...[
            "morning",
            "afternoon",
            "night"
        ].filter(
            section =>
                section !== current
        )

    ];


    order.forEach(
        section => {

            if (
                groups[section].length === 0
            ) {

                return;

            }


            const sectionElement =
                document.createElement(
                    "section"
                );


            sectionElement.className =
                "time-section" +
                (
                    section === current
                    ? " current"
                    : ""
                );


            sectionElement.dataset.time =
                section;


            sectionElement.innerHTML = `

                <div class="time-heading">

                    ${timeOfDayLabel(section)}

                </div>

                <div
                    class="routine"
                    data-section="${section}"
                ></div>

            `;


            routine.appendChild(
                sectionElement
            );


            const container =
                sectionElement.querySelector(
                    ".routine"
                );


            groups[section].forEach(
                item => {

                    renderItem(
                        item,
                        container
                    );

                }
            );

        }
    );


    renderEarlierToday();

    updateProgress();

}


/* ==================================================
   RENDER TASK
   ================================================== */

function renderItem(
    item,
    routine
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "task-wrapper";


    wrapper.dataset.id =
        item.id;


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "item" +
        (
            item.completed
            ? " completed"
            : ""
        );


    element.dataset.id =
        item.id;


    const detailsHTML =
        item.details
        ? `
            <div class="details-preview">
                ${escapeHtml(item.details)}
            </div>
          `
        : "";


    element.innerHTML = `

        <input
            class="checkbox"
            type="checkbox"
            ${item.completed ? "checked" : ""}
            aria-label="Complete task"
        >


        <div class="item-content">

            <div class="item-name">
                ${escapeHtml(item.text)}
            </div>


            <div class="timestamp">

                ${
                    item.completed
                    ? "Completed at " +
                      escapeHtml(
                          item.completedAt
                      )
                    : ""
                }

            </div>


            ${detailsHTML}

        </div>


        <button
            class="task-action schedule-button"
            title="Change schedule"
            aria-label="Change schedule"
        >
            ↻
        </button>


        <button
            class="task-action snooze-button"
            title="Snooze until tomorrow"
            aria-label="Snooze until tomorrow"
        >
            ◷
        </button>


        <button
            class="task-action delete delete-button"
            title="Delete permanently"
            aria-label="Delete permanently"
        >
            ×
        </button>

    `;


    const schedulePanel =
        document.createElement(
            "div"
        );


    schedulePanel.className =
        "schedule-panel";


    schedulePanel.id =
        "schedule-" +
        item.id;


    schedulePanel.innerHTML =
        createSchedulePicker(
            item
        );


    wrapper.appendChild(
        element
    );


    wrapper.appendChild(
        schedulePanel
    );


    routine.appendChild(
        wrapper
    );


    /*
     * Event listeners instead of inline
     * onclick handlers. This makes the
     * drag system much more reliable.
     */

    const checkbox =
        element.querySelector(
            ".checkbox"
        );


    checkbox.addEventListener(
        "change",
        () =>
            toggleItem(item.id)
    );


    const name =
        element.querySelector(
            ".item-name"
        );


    name.addEventListener(
        "click",
        () =>
            openEditModal(item.id)
    );


    const scheduleButton =
        element.querySelector(
            ".schedule-button"
        );


    scheduleButton.addEventListener(
        "click",
        () =>
            toggleSchedulePanel(item.id)
    );


    const snoozeButton =
        element.querySelector(
            ".snooze-button"
        );


    snoozeButton.addEventListener(
        "click",
        () =>
            snoozeItem(item.id)
    );


    const deleteButton =
        element.querySelector(
            ".delete-button"
        );


    deleteButton.addEventListener(
        "click",
        () =>
            deleteItem(item.id)
    );


    attachDragHandlers(
        wrapper,
        item.id
    );

}


/* ==================================================
   SCHEDULE PICKER
   ================================================== */

function createSchedulePicker(
    item
) {

    const days = [

        {
            value: "everyday",
            label: "Every day"
        },

        {
            value: 1,
            label: "Mon"
        },

        {
            value: 2,
            label: "Tue"
        },

        {
            value: 3,
            label: "Wed"
        },

        {
            value: 4,
            label: "Thu"
        },

        {
            value: 5,
            label: "Fri"
        },

        {
            value: 6,
            label: "Sat"
        },

        {
            value: 0,
            label: "Sun"
        }

    ];


    return `

        <div class="schedule-title">
            Repeat
        </div>


        <div class="schedule-options">

            ${days.map(
                day => {

                    const selected =
                        item.schedule.includes(
                            day.value
                        );


                    return `

                        <button
                            class="day-button ${
                                selected
                                ? "selected"
                                : ""
                            }"
                            data-day="${day.value}"
                        >
                            ${day.label}
                        </button>

                    `;

                }
            ).join("")}

        </div>

    `;

}


/* ==================================================
   SCHEDULE PANEL
   ================================================== */

function toggleSchedulePanel(
    id
) {

    const panel =
        document.getElementById(
            "schedule-" + id
        );


    if (!panel) {

        return;

    }


    const wasOpen =
        panel.classList.contains(
            "open"
        );


    document
        .querySelectorAll(
            ".schedule-panel"
        )
        .forEach(
            otherPanel => {

                otherPanel.classList.remove(
                    "open"
                );

            }
        );


    if (!wasOpen) {

        panel.classList.add(
            "open"
        );


        panel
            .querySelectorAll(
                ".day-button"
            )
            .forEach(
                button => {

                    button.onclick = () => {

                        toggleSchedule(
                            id,
                            button.dataset.day
                        );

                    };

                }
            );

    }

}


/* ==================================================
   CHANGE SCHEDULE
   ================================================== */

function toggleSchedule(
    id,
    value
) {

    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    if (
        value !== "everyday"
    ) {

        value =
            Number(value);

    }


    if (
        value === "everyday"
    ) {

        item.schedule =
            ["everyday"];

    } else {

        if (
            item.schedule.includes(
                "everyday"
            )
        ) {

            item.schedule =
                [value];

        } else if (
            item.schedule.includes(
                value
            )
        ) {

            item.schedule =
                item.schedule.filter(
                    day =>
                        day !== value
                );

        } else {

            item.schedule.push(
                value
            );

        }


        if (
            item.schedule.length === 0
        ) {

            item.schedule =
                ["everyday"];

        }

    }


    saveData();


    const panel =
        document.getElementById(
            "schedule-" + id
        );


    if (panel) {

        panel.innerHTML =
            createSchedulePicker(
                item
            );


        panel.classList.add(
            "open"
        );


        panel
            .querySelectorAll(
                ".day-button"
            )
            .forEach(
                button => {

                    button.onclick = () => {

                        toggleSchedule(
                            id,
                            button.dataset.day
                        );

                    };

                }
            );

    }

}


/* ==================================================
   COMPLETE
   ================================================== */

function toggleItem(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    if (
        item.completed
    ) {

        item.completed =
            false;

        item.completedAt =
            null;

    } else {

        item.completed =
            true;

        item.completedAt =
            new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour:
                            "numeric",

                        minute:
                            "2-digit"
                    }
                );

    }


    saveData();

    render();

}


/* ==================================================
   SNOOZE
   ================================================== */

function snoozeItem(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    item.snoozed =
        true;


    item.snoozedUntil =
        todayKey();


    saveData();

    render();

}


/* ==================================================
   EARLIER TODAY
   ================================================== */

function renderEarlierToday() {

    const section =
        document.getElementById(
            "earlierSection"
        );


    const container =
        document.getElementById(
            "earlierRoutine"
        );


    container.innerHTML =
        "";


    const current =
        getCurrentTimeOfDay();


    const earlierSections = {

        morning:
            current !== "morning",

        afternoon:
            current === "night"

    };


    const earlierItems =
        sortItems(
            data.items.filter(
                item => {

                    if (
                        !item.completed
                    ) {

                        return false;

                    }


                    if (
                        !isScheduledToday(item)
                    ) {

                        return false;

                    }


                    if (
                        item.snoozed
                    ) {

                        return false;

                    }


                    if (
                        current === "afternoon"
                    ) {

                        return (
                            item.timeOfDay ===
                            "morning"
                        );

                    }


                    if (
                        current === "night"
                    ) {

                        return (
                            item.timeOfDay ===
                                "morning" ||
                            item.timeOfDay ===
                                "afternoon"
                        );

                    }


                    return false;

                }
            )
        );


    if (
        earlierItems.length === 0
    ) {

        section.style.display =
            "none";

        return;

    }


    section.style.display =
        "block";


    earlierItems.forEach(
        item => {

            renderItem(
                item,
                container
            );

        }
    );

}


/* ==================================================
   EDIT MODAL
   ================================================== */

function openEditModal(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    editingItemId =
        id;


    const nameInput =
        document.getElementById(
            "editTaskName"
        );


    const detailsInput =
        document.getElementById(
            "editTaskDetails"
        );


    nameInput.value =
        item.text;


    detailsInput.value =
        item.details || "";


    selectTimeOfDay(
        item.timeOfDay || "morning"
    );


    document
        .getElementById(
            "editModal"
        )
        .classList.add(
            "open"
        );

}


/* ==================================================
   TIME SELECTOR
   ================================================== */

function selectTimeOfDay(
    value
) {

    selectedTimeOfDay =
        value;


    document
        .querySelectorAll(
            ".time-option"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "selected",
                    button.dataset.time ===
                        value
                );

            }
        );

}


/* ==================================================
   SAVE EDIT
   ================================================== */

function saveEditModal() {

    if (
        !editingItemId
    ) {

        return;

    }


    const item =
        data.items.find(
            item =>
                item.id ===
                editingItemId
        );


    if (!item) {

        closeEditModal();

        return;

    }


    const nameInput =
        document.getElementById(
            "editTaskName"
        );


    const detailsInput =
        document.getElementById(
            "editTaskDetails"
        );


    const newName =
        nameInput.value.trim();


    if (
        newName === ""
    ) {

        nameInput.focus();

        return;

    }


    item.text =
        newName;


    item.details =
        detailsInput.value.trim();


    item.timeOfDay =
        selectedTimeOfDay;


    saveData();

    closeEditModal();

    render();

}


/* ==================================================
   CLOSE MODAL
   ================================================== */

function closeEditModal() {

    const modal =
        document.getElementById(
            "editModal"
        );


    modal.classList.remove(
        "open"
    );


    editingItemId =
        null;

}


/* ==================================================
   TAP OUTSIDE MODAL
   ================================================== */

function handleBackdropClick(
    event
) {

    if (
        event.target.id ===
        "editModal"
    ) {

        closeEditModal();

    }

}


/* ==================================================
   ADD TASK
   ================================================== */

function addItem() {

    checkForNewDay();


    const newItem = {

        id:
            createId(),

        text:
            "",

        details:
            "",

        completed:
            false,

        completedAt:
            null,

        snoozed:
            false,

        snoozedUntil:
            null,

        schedule:
            ["everyday"],

        timeOfDay:
            getCurrentTimeOfDay(),

        order:
            getNextOrder()

    };


    data.items.push(
        newItem
    );


    saveData();


    /*
     * Instead of showing a placeholder
     * task first, immediately open the
     * editing window.
     */

    editingItemId =
        newItem.id;


    selectedTimeOfDay =
        newItem.timeOfDay;


    document.getElementById(
        "editTaskName"
    ).value = "";


    document.getElementById(
        "editTaskDetails"
    ).value = "";


    selectTimeOfDay(
        newItem.timeOfDay
    );


    document
        .getElementById(
            "editModal"
        )
        .classList.add(
            "open"
        );


    /*
     * Put the cursor directly in the
     * empty task-name field.
     */

    setTimeout(
        () => {

            document
                .getElementById(
                    "editTaskName"
                )
                .focus();

        },
        100
    );

}


/* ==================================================
   NEXT ORDER
   ================================================== */

function getNextOrder() {

    if (
        data.items.length === 0
    ) {

        return 0;

    }


    return Math.max(
        ...data.items.map(
            item =>
                typeof item.order ===
                "number"
                ? item.order
                : 0
        )
    ) + 1;

}


/* ==================================================
   DELETE
   ================================================== */

function deleteItem(
    id
) {

    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    data.items =
        data.items.filter(
            item =>
                item.id !== id
        );


    saveData();

    render();

}


/* ==================================================
   PROGRESS
   ================================================== */

function updateProgress() {

    const visibleItems =
        getVisibleItems();


    const total =
        visibleItems.length;


    const completed =
        visibleItems.filter(
            item =>
                item.completed
        ).length;


    const progress =
        document.getElementById(
            "progress"
        );


    if (
        total === 0
    ) {

        progress.innerHTML =
            "";

        return;

    }


    progress.innerHTML =

        `<strong>${completed}</strong>
         of ${total} completed`;

}

   RESET TODAY
   ================================================== */

function resetToday() {

    checkForNewDay();


    if (
        !confirm(
            "Reset all of today's completed and snoozed items?"
        )
    ) {

        return;

    }


    data.items.forEach(
        item => {

            item.completed =
                false;

            item.completedAt =
                null;

            item.snoozed =
                false;

            item.snoozedUntil =
                null;

        }
    );


    saveData();

    render();

}

   DATE DISPLAY
   ================================================== */

function updateDate() {

    const date =
        new Date();


    document.getElementById(
        "date"
    ).textContent =

        date.toLocaleDateString(
            [],
            {
                weekday:

            }
        );

/* ==================================================
   ESCAPE HTML
   ================================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* ==================================================
   IPHONE DRAG / REORDER
   ================================================== */

let dragState = null;


function attachDragHandlers(
    wrapper,
    id
) {

    let timer = null;

    let longPressTriggered =
        false;


    function startPress(
        event
    ) {

        /*
         * Don't start dragging when the
         * user touches a control.
         */

        if (
            event.target.closest(
                "button,input,textarea"
            )
        ) {

            return;

        }


        const touch =
            event.touches
                ? event.touches[0]
                : event;


        timer =
            setTimeout(
                () => {

                    longPressTriggered =
                        true;

                    startDragging(
                        wrapper,
                        id,
                        touch.clientY
                    );

                },
                420
            );

    }


    function cancelPress() {

        if (timer) {

            clearTimeout(timer);

            timer =
                null;

        }

    }


    function moveBeforeDrag(
        event
    ) {

        if (
            !longPressTriggered
        ) {

            cancelPress();

        }

    }


    function endPress() {

        cancelPress();

        if (
            longPressTriggered &&
            dragState
        ) {

            finishDragging();

        }

        longPressTriggered =
            false;

    }


    wrapper.addEventListener(
        "touchstart",
        startPress,
        {
            passive: true
        }
    );


    wrapper.addEventListener(
        "touchmove",
        moveBeforeDrag,
        {
            passive: true
        }
    );


    wrapper.addEventListener(
        "touchend",
        endPress,
        {
            passive: true
        }
    );


    wrapper.addEventListener(
        "touchcancel",
        endPress,
        {
            passive: true
        }
    );

}


function startDragging(
    wrapper,
    id,
    startY
) {

    if (
        dragState
    ) {

        return;

    }


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    const section =
        wrapper.closest(
            ".routine[data-section]"
        );


    if (!section) {

        return;

    }


    dragState = {

        id:
            id,

        wrapper:
            wrapper,

        section:
            section,

        startY:
            startY

    };


    wrapper
        .querySelector(
            ".item"
        )
        .classList.add(
            "dragging"
        );


    document.body.style
        .userSelect =
        "none";

    document.body.style
        .webkitUserSelect =
        "none";


    document.addEventListener(
        "touchmove",
        handleDragMove,
        {
            passive: false
        }
    );


    document.addEventListener(
        "touchend",
        finishDragging,
        {
            passive: true,
            once: true
        }
    );

}


function handleDragMove(
    event
) {

    if (
        !dragState
    ) {

        return;

    }


    event.preventDefault();


    const touch =
        event.touches[0];


    const y =
        touch.clientY;


    const section =
        dragState.section;


    const wrappers =
        [
            ...section.querySelectorAll(
                ".task-wrapper"
            )
        ]
        .filter(
            wrapper =>
                wrapper !==
                dragState.wrapper
        );


    let closest =
        null;

    let closestDistance =
        Infinity;


    wrappers.forEach(
        wrapper => {

            const rect =
                wrapper.getBoundingClientRect();


            const center =
                rect.top +
                rect.height / 2;


            const distance =
                Math.abs(
                    y - center
                );


            if (
                distance <
                closestDistance
            ) {

                closestDistance =
                    distance;

                closest =
                    wrapper;

            }

        }
    );


    if (
        closest
    ) {

        const rect =
            closest.getBoundingClientRect();


        if (
            y <
            rect.top +
            rect.height / 2
        ) {

            section.insertBefore(
                dragState.wrapper,
                closest
            );

        } else {

            section.insertBefore(
                dragState.wrapper,
                closest.nextSibling
            );

        }

    }


    saveCurrentVisualOrder();

}


function finishDragging() {

    if (
        !dragState
    ) {

        return;

    }


    document.removeEventListener(
        "touchmove",
        handleDragMove
    );


    document.body.style
        .userSelect =
        "";

    document.body.style
        .webkitUserSelect =
        "";


    const itemElement =
        dragState.wrapper
            .querySelector(
                ".item"
            );


    if (itemElement) {

        itemElement.classList.remove(
            "dragging"
        );

    }


    saveCurrentVisualOrder();


    dragState =
        null;


    render();

}


/* ==================================================
   SAVE VISUAL ORDER
   ================================================== */

function saveCurrentVisualOrder() {

    if (
        !dragState
    ) {

        return;

    }


    const wrappers =
        [
            ...dragState.section
                .querySelectorAll(
                    ".task-wrapper"
                )
        ];


    wrappers.forEach(
        (wrapper, index) => {

            const id =
                wrapper.dataset.id;


            const item =
                data.items.find(
                    item =>
                        item.id === id
                );


            if (item) {

                item.order =
                    index;

            }

        }
    );


    /*
     * Give tasks in other time-of-day
     * sections enough separation that
     * moving one section doesn't
     * accidentally affect another.
     */

    normalizeOrders();

    saveData();

}


/* ==================================================
   NORMALIZE ORDERS
   ================================================== */

function normalizeOrders() {

    const sections = [

        "morning",
        "afternoon",
        "night"

    ];


    let order =
        0;


    sections.forEach(
        section => {

            sortItems(
                data.items.filter(
                    item =>
                        item.timeOfDay ===
                        section
                )
            ).forEach(
                item => {

                    item.order =
                        order++;

                }
            );

        }
    );

}


/* ==================================================
   PERIODIC TIME CHECK
   ==================================================

   This allows NovaVesta to move the
   appropriate section to the top even
   if the app remains open across noon
   or 5 PM.

   ================================================== */

setInterval(
    () => {

        const current =
            getCurrentTimeOfDay();


        if (
            current !==
            window.lastKnownTimeOfDay
        ) {

            window.lastKnownTimeOfDay =
                current;

            render();

        }

    },
    30000
);


/* ==================================================
   START
   ================================================== */

checkForNewDay();

updateDate();

window.lastKnownTimeOfDay =
    getCurrentTimeOfDay();

render();

</script>
