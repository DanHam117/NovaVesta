<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="NovaVesta"
>

<meta
    name="theme-color"
    content="#07100b"
>

<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<title>NovaVesta</title>


<style>

/* ==================================================
   NOVAVESTA — VIRIDITAS VESTAE
   ================================================== */

:root {

    --bg: #07100b;
    --panel: #0d1a12;
    --panel-active: #102319;
    --green: #55d68a;
    --green-bright: #7affad;
    --green-dim: #347a50;
    --text: #edf8f0;
    --muted: #789080;
    --border: rgba(85, 214, 138, 0.17);
    --danger: #d86b6b;

    --glow:
        0 0 18px
        rgba(85, 214, 138, 0.18);
}


* {

    box-sizing: border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html {

    background: var(--bg);

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;

    min-height: 100%;

}


body {

    margin: 0;

    min-height: 100vh;
    min-height: 100dvh;

    overflow-x: hidden;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(44, 130, 76, 0.18),
            transparent 45%
        ),

        var(--bg);

    color: var(--text);

    font-family:

        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    touch-action: manipulation;

}


/* ==================================================
   APP
   ================================================== */

.app {

    width: 100%;

    max-width: 680px;

    margin: 0 auto;

    padding-top:
        max(22px, env(safe-area-inset-top));

    padding-left:
        max(18px, env(safe-area-inset-left));

    padding-right:
        max(18px, env(safe-area-inset-right));

    padding-bottom:
        calc(
            40px +
            env(safe-area-inset-bottom)
        );

}


/* ==================================================
   HEADER
   ================================================== */

header {

    text-align: center;

    padding-top: 8px;

    margin-bottom: 24px;

}


.flame {

    font-size: 25px;

    color: var(--green-bright);

    text-shadow:
        0 0 15px
        rgba(122, 255, 173, 0.5);

    margin-bottom: 4px;

}


h1 {

    margin: 0;

    font-size: 29px;

    line-height: 1.15;

    font-weight: 600;

    letter-spacing: -0.4px;

}


.date {

    margin-top: 7px;

    color: var(--muted);

    font-size: 14px;

}


/* ==================================================
   TIME OF DAY HEADINGS
   ================================================== */

.time-section {

    margin-bottom: 22px;

}


.time-heading {

    margin:

        4px 0 9px 2px;

    color: var(--muted);

    font-size: 13px;

    font-weight: 500;

    text-transform: uppercase;

    letter-spacing: 1px;

}


.time-heading.current {

    color: var(--green);

}


/* ==================================================
   PROGRESS
   ================================================== */

.progress {

    text-align: center;

    margin-bottom: 16px;

    color: var(--muted);

    font-size: 14px;

}


.progress strong {

    color: var(--green);

}


/* ==================================================
   ROUTINE
   ================================================== */

.routine {

    display: flex;

    flex-direction: column;

}


/* ==================================================
   TASK
   ================================================== */

.task-wrapper {

    width: 100%;

    margin-bottom: 9px;

    transition:
        transform 0.12s ease;

}


.item {

    display: flex;

    align-items: center;

    gap: 10px;

    width: 100%;

    min-height: 68px;

    padding:
        12px
        7px
        12px
        14px;

    background:
        rgba(13, 26, 18, 0.96);

    border:
        1px solid var(--border);

    border-radius: 14px;

    transition:
        background 0.15s ease,
        border-color 0.15s ease,
        opacity 0.15s ease,
        transform 0.12s ease,
        box-shadow 0.12s ease;

}


.item:active {

    background:
        var(--panel-active);

    border-color:
        rgba(85, 214, 138, 0.32);

}


.item.completed {

    opacity: 0.67;

}


/* ==================================================
   DRAGGING
   ================================================== */

.task-wrapper.dragging {

    z-index: 100;

}


.task-wrapper.dragging .item {

    transform:
        scale(1.025);

    border-color:
        var(--green-dim);

    box-shadow:
        0 8px 28px
        rgba(0, 0, 0, 0.45),

        var(--glow);

    opacity: 0.95;

}


.task-wrapper.drag-over {

    transform:
        translateY(5px);

}


.task-wrapper.drag-over .item {

    border-color:
        var(--green);

}


/* ==================================================
   CHECKBOX
   ================================================== */

.checkbox {

    appearance: none;

    -webkit-appearance: none;

    width: 30px;

    height: 30px;

    min-width: 30px;

    margin: 0;

    border:
        2px solid
        var(--green-dim);

    border-radius: 9px;

    background: transparent;

    position: relative;

    cursor: pointer;

}


.checkbox::before {

    content: "";

    position: absolute;

    inset: -10px;

}


.checkbox:checked {

    background:
        var(--green);

    border-color:
        var(--green);

    box-shadow:
        0 0 14px
        rgba(85, 214, 138, 0.32);

}


.checkbox:checked::after {

    content: "✓";

    position: absolute;

    left: 4px;

    top: -1px;

    color: #07100b;

    font-size: 21px;

    font-weight: 800;

}


/* ==================================================
   TASK CONTENT
   ================================================== */

.item-content {

    flex: 1;

    min-width: 0;

}


.item-name {

    font-size: 17px;

    line-height: 1.3;

    font-weight: 450;

    word-break: break-word;

    cursor: pointer;

}


.item-name:active {

    color:
        var(--green);

}


.completed .item-name {

    text-decoration: line-through;

    color: #91a598;

}


.timestamp {

    margin-top: 3px;

    min-height: 15px;

    color:
        var(--green-dim);

    font-size: 12px;

}


/* ==================================================
   TASK BUTTONS
   ================================================== */

.task-action {

    width: 32px;

    height: 32px;

    min-width: 32px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 0;

    background: transparent;

    border: none;

    border-radius: 50%;

    color: #52675a;

    cursor: pointer;

    font-size: 17px;

}


.task-action:active {

    background:
        rgba(85, 214, 138, 0.12);

    color:
        var(--green);

}


.delete {

    color: #405247;

    font-size: 21px;

}


.delete:active {

    background:
        rgba(216, 107, 107, 0.10);

    color:
        var(--danger);

}


/* ==================================================
   SCHEDULE PANEL
   ================================================== */

.schedule-panel {

    display: none;

    margin-top: 5px;

    padding: 12px;

    background:
        var(--panel);

    border:
        1px solid var(--border);

    border-radius: 12px;

    box-shadow:
        var(--glow);

}


.schedule-panel.open {

    display: block;

}


.schedule-title {

    margin-bottom: 9px;

    color: var(--muted);

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 0.6px;

}


.schedule-options {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

}


.day-button {

    min-height: 36px;

    padding:
        7px 11px;

    border:
        1px solid
        rgba(85, 214, 138, 0.14);

    border-radius: 9px;

    background:
        rgba(85, 214, 138, 0.04);

    color: var(--muted);

    font-size: 13px;

    cursor: pointer;

}


.day-button.selected {

    background:
        rgba(85, 214, 138, 0.16);

    border-color:
        var(--green-dim);

    color:
        var(--green);

}


.day-button:active {

    transform:
        scale(0.97);

}


/* ==================================================
   EMPTY
   ================================================== */

.empty {

    text-align: center;

    color: var(--muted);

    padding:
        34px 20px;

    border:
        1px dashed var(--border);

    border-radius: 14px;

    line-height: 1.5;

}


/* ==================================================
   ADD BUTTON
   ================================================== */

.controls {

    display: flex;

    justify-content: center;

    margin-top: 9px;

}


.add-button {

    min-height: 46px;

    padding:
        10px 18px;

    border-radius: 12px;

    border:
        1px solid var(--border);

    background:
        rgba(85, 214, 138, 0.07);

    color:
        var(--green);

    font-size: 15px;

    cursor: pointer;

}


.add-button:active {

    background:
        rgba(85, 214, 138, 0.16);

    transform:
        scale(0.98);

}


/* ==================================================
   SETTINGS
   ================================================== */

.settings {

    margin-top: 27px;

    padding-top: 17px;

    border-top:
        1px solid
        rgba(85, 214, 138, 0.08);

    text-align: center;

}


.settings button {

    min-height: 40px;

    padding:
        8px 14px;

    background: none;

    border: none;

    color: #52675a;

    font-size: 13px;

}


/* ==================================================
   EDIT MODAL
   ================================================== */

.modal-backdrop {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: flex-end;

    justify-content: center;

    padding:

        18px

        18px

        max(
            18px,
            env(safe-area-inset-bottom)
        );

    background:
        rgba(0, 0, 0, 0.68);

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

}


.modal-backdrop.open {

    display: flex;

}


.modal {

    width: 100%;

    max-width: 600px;

    background:
        #0d1a12;

    border:
        1px solid
        rgba(85, 214, 138, 0.22);

    border-radius: 20px;

    padding:
        20px;

    box-shadow:

        0 0 30px
        rgba(85, 214, 138, 0.15),

        0 -10px 50px
        rgba(0, 0, 0, 0.4);

    animation:
        modalIn 0.18s ease-out;

}


@keyframes modalIn {

    from {

        transform:
            translateY(20px);

        opacity: 0;

    }

    to {

        transform:
            translateY(0);

        opacity: 1;

    }

}


.modal-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;

}


.modal-title {

    margin: 0;

    font-size: 21px;

    font-weight: 600;

}


.modal-close {

    width: 36px;

    height: 36px;

    border: none;

    border-radius: 50%;

    background:
        rgba(85, 214, 138, 0.06);

    color:
        var(--muted);

    font-size: 23px;

    line-height: 1;

}


.form-group {

    margin-bottom: 16px;

}


.form-label {

    display: block;

    margin-bottom: 7px;

    color:
        var(--muted);

    font-size: 13px;

}


.form-input,
.form-textarea {

    width: 100%;

    border:
        1px solid
        rgba(85, 214, 138, 0.18);

    border-radius: 11px;

    background:
        #07100b;

    color:
        var(--text);

    font-family: inherit;

    font-size: 16px;

    outline: none;

}


.form-input {

    height: 48px;

    padding:
        0 13px;

}


.form-textarea {

    min-height: 110px;

    resize: vertical;

    padding:
        12px 13px;

    line-height: 1.45;

}


.form-input:focus,
.form-textarea:focus {

    border-color:
        var(--green-dim);

    box-shadow:
        0 0 12px
        rgba(85, 214, 138, 0.12);

}


.modal-actions {

    display: flex;

    gap: 10px;

    margin-top: 20px;

}


.modal-button {

    flex: 1;

    min-height: 48px;

    border-radius: 11px;

    font-size: 15px;

    font-weight: 500;

}


.modal-cancel {

    background:
        rgba(85, 214, 138, 0.05);

    border:
        1px solid
        var(--border);

    color:
        var(--muted);

}


.modal-save {

    background:
        rgba(85, 214, 138, 0.15);

    border:
        1px solid
        var(--green-dim);

    color:
        var(--green-bright);

}


/* ==================================================
   SMALL IPHONES
   ================================================== */

@media (max-width: 375px) {

    .app {

        padding-left:
            max(
                14px,
                env(safe-area-inset-left)
            );

        padding-right:
            max(
                14px,
                env(safe-area-inset-right)
            );

    }


    h1 {

        font-size: 27px;

    }


    .item {

        min-height: 64px;

        gap: 8px;

    }


    .item-name {

        font-size: 16px;

    }


    .checkbox {

        width: 28px;

        height: 28px;

        min-width: 28px;

    }


    .task-action {

        width: 30px;

        height: 30px;

        min-width: 30px;

    }

}


/* ==================================================
   DESKTOP
   ================================================== */

@media (min-width: 700px) {

    .app {

        padding-top: 50px;

        padding-left: 20px;

        padding-right: 20px;

    }


    h1 {

        font-size: 32px;

    }


    .item {

        padding:
            17px
            10px
            17px
            18px;

    }


    .item:hover {

        background:
            #112219;

        border-color:
            rgba(85, 214, 138, 0.30);

        box-shadow:
            var(--glow);

    }

}

</style>

</head>


<body>


<div class="app">


<header>

    <div class="flame">✦</div>

    <h1>NovaVesta</h1>

    <div
        class="date"
        id="date"
    ></div>

</header>


<div
    class="progress"
    id="progress"
></div>


<main
    class="routine"
    id="routine"
></main>


<div class="controls">

    <button
        class="add-button"
        onclick="addItem()"
    >
        + Add routine item
    </button>

</div>


<div class="settings">

    <button
        onclick="resetToday()"
    >
        Reset today's checklist
    </button>

</div>


</div>


<!-- ==================================================
     EDIT TASK MODAL
     ================================================== -->

<div
    class="modal-backdrop"
    id="editModal"
    onclick="handleBackdropClick(event)"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >

        <div class="modal-header">

            <h2
                class="modal-title"
                id="modalTitle"
            >
                Edit Task
            </h2>

            <button
                class="modal-close"
                onclick="closeEditModal()"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="editTaskName"
            >
                Task name
            </label>

            <input
                class="form-input"
                id="editTaskName"
                type="text"
                autocomplete="off"
            >

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="editTaskDetails"
            >
                Details
            </label>

            <textarea
                class="form-textarea"
                id="editTaskDetails"
                placeholder="Optional notes about this task..."
            ></textarea>

        </div>


        <div class="modal-actions">

            <button
                class="modal-button modal-cancel"
                onclick="closeEditModal()"
            >
                Cancel
            </button>

            <button
                class="modal-button modal-save"
                onclick="saveEditModal()"
            >
                Save
            </button>

        </div>

    </div>

</div>


<script>

/* ==================================================
   STORAGE
   ================================================== */

const STORAGE_KEY =
    "novavesta-morning-routine";


const DEFAULT_ITEMS = [

    "Get dressed",

    "Brush teeth",

    "Take medications / vitamins",

    "Eat breakfast",

    "Pack everything I need",

    "Check today's schedule",

    "Leave for the day"

];


let data =
    loadData();


let editingItemId =
    null;


let dragState = {

    id: null,

    wrapper: null,

    startY: 0,

    active: false

};


/* ==================================================
   DATE
   ================================================== */

function todayKey() {

    const now =
        new Date();

    return [

        now.getFullYear(),

        String(
            now.getMonth() + 1
        ).padStart(2, "0"),

        String(
            now.getDate()
        ).padStart(2, "0")

    ].join("-");

}


function currentDay() {

    return new Date().getDay();

}


/* ==================================================
   TIME OF DAY
   ================================================== */

function getTimePeriod() {

    const hour =
        new Date().getHours();


    if (
        hour >= 12 &&
        hour < 17
    ) {

        return "afternoon";

    }


    if (
        hour >= 17 ||
        hour < 2
    ) {

        return "night";

    }


    return "morning";

}


function getPeriodLabel(
    period
) {

    if (
        period === "morning"
    ) {

        return "Morning";

    }


    if (
        period === "afternoon"
    ) {

        return "Afternoon";

    }


    return "Night";

}


/* ==================================================
   LOAD DATA
   ================================================== */

function loadData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (saved) {

        try {

            const parsed =
                JSON.parse(saved);


            if (
                parsed &&
                Array.isArray(
                    parsed.items
                )
            ) {

                parsed.items.forEach(
                    item => {

                        if (
                            typeof item.completed !==
                            "boolean"
                        ) {

                            item.completed =
                                false;

                        }


                        if (
                            typeof item.completedAt ===
                            "undefined"
                        ) {

                            item.completedAt =
                                null;

                        }


                        if (
                            typeof item.snoozed !==
                            "boolean"
                        ) {

                            item.snoozed =
                                false;

                        }


                        if (
                            typeof item.snoozedUntil ===
                            "undefined"
                        ) {

                            item.snoozedUntil =
                                null;

                        }


                        if (
                            typeof item.details !==
                            "string"
                        ) {

                            item.details =
                                "";

                        }


                        if (
                            !Array.isArray(
                                item.schedule
                            )
                        ) {

                            item.schedule =
                                ["everyday"];

                        }


                        if (
                            !item.period
                        ) {

                            item.period =
                                "morning";

                        }

                    }
                );


                if (
                    !parsed.date
                ) {

                    parsed.date =
                        todayKey();

                }


                return parsed;

            }

        } catch (error) {

            console.error(
                "NovaVesta could not read saved data:",
                error
            );

        }

    }


    return {

        date:
            todayKey(),

        items:
            DEFAULT_ITEMS.map(
                text => ({

                    id:
                        createId(),

                    text:
                        text,

                    details:
                        "",

                    completed:
                        false,

                    completedAt:
                        null,

                    snoozed:
                        false,

                    snoozedUntil:
                        null,

                    schedule:
                        ["everyday"],

                    period:
                        "morning"

                })
            )

    };

}


/* ==================================================
   ID
   ================================================== */

function createId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();

    }


    return (

        Date.now().toString(36) +

        Math.random()
            .toString(36)
            .substring(2)

    );

}


/* ==================================================
   SAVE
   ================================================== */

function saveData() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(data)

    );

}


/* ==================================================
   NEW DAY
   ================================================== */

function checkForNewDay() {

    const today =
        todayKey();


    if (
        data.date === today
    ) {

        return;

    }


    data.date =
        today;


    data.items.forEach(
        item => {

            item.completed =
                false;

            item.completedAt =
                null;

            item.snoozed =
                false;

            item.snoozedUntil =
                null;

        }
    );


    saveData();

}


/* ==================================================
   SCHEDULE
   ================================================== */

function isScheduledToday(
    item
) {

    if (
        !Array.isArray(
            item.schedule
        ) ||
        item.schedule.length === 0
    ) {

        return true;

    }


    if (
        item.schedule.includes(
            "everyday"
        )
    ) {

        return true;

    }


    return item.schedule.includes(
        currentDay()
    );

}


/* ==================================================
   VISIBLE ITEMS
   ================================================== */

function getVisibleItems() {

    return data.items.filter(

        item =>

            isScheduledToday(item) &&

            !item.snoozed

    );

}


/* ==================================================
   ORDER
   ================================================== */

function sortItemsBySavedOrder(
    items
) {

    return [...items].sort(
        (a, b) => {

            const aOrder =
                Number.isFinite(
                    a.order
                )
                ? a.order
                : 999999;

            const bOrder =
                Number.isFinite(
                    b.order
                )
                ? b.order
                : 999999;

            return aOrder - bOrder;

        }
    );

}


function normalizeOrders() {

    const periods = [

        "morning",
        "afternoon",
        "night"

    ];


    periods.forEach(
        period => {

            const items =
                data.items
                    .filter(
                        item =>
                            item.period ===
                            period
                    )
                    .sort(
                        (a, b) =>
                            (
                                Number.isFinite(a.order)
                                ? a.order
                                : 999999
                            ) -
                            (
                                Number.isFinite(b.order)
                                ? b.order
                                : 999999
                            )
                    );


            items.forEach(
                (item, index) => {

                    item.order =
                        index;

                }
            );

        }
    );

}


/* ==================================================
   RENDER
   ================================================== */

function render() {

    checkForNewDay();

    normalizeOrders();

    saveData();


    const routine =
        document.getElementById(
            "routine"
        );


    routine.innerHTML =
        "";


    const visibleItems =
        sortItemsBySavedOrder(
            getVisibleItems()
        );


    const periods = [

        "morning",
        "afternoon",
        "night"

    ];


    const currentPeriod =
        getTimePeriod();


    let renderedAnything =
        false;


    periods.forEach(
        period => {

            const periodItems =
                visibleItems.filter(
                    item =>
                        item.period ===
                        period
                );


            if (
                periodItems.length === 0
            ) {

                return;

            }


            renderedAnything =
                true;


            const section =
                document.createElement(
                    "section"
                );


            section.className =
                "time-section";


            const heading =
                document.createElement(
                    "div"
                );


            heading.className =
                "time-heading" +

                (
                    period ===
                    currentPeriod
                    ? " current"
                    : ""
                );


            heading.textContent =
                getPeriodLabel(
                    period
                );


            section.appendChild(
                heading
            );


            const list =
                document.createElement(
                    "div"
                );


            periodItems.forEach(
                item => {

                    renderItem(
                        item,
                        list
                    );

                }
            );


            section.appendChild(
                list
            );


            routine.appendChild(
                section
            );

        }
    );


    if (
        !renderedAnything
    ) {

        routine.innerHTML = `

            <div class="empty">

                Nothing left on
                today's routine.

                <br><br>

                Enjoy the day.

            </div>

        `;

    }


    updateProgress();

}


/* ==================================================
   RENDER TASK
   ================================================== */

function renderItem(
    item,
    list
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "task-wrapper";


    wrapper.dataset.id =
        item.id;


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "item" +

        (
            item.completed
            ? " completed"
            : ""
        );


    element.innerHTML = `

        <input
            class="checkbox"
            type="checkbox"
            ${item.completed ? "checked" : ""}
            aria-label="Complete task"
        >


        <div class="item-content">

            <div
                class="item-name"
            >
                ${escapeHtml(item.text)}
            </div>


            <div class="timestamp">

                ${
                    item.completed
                    ? "Completed at " +
                      escapeHtml(
                          item.completedAt
                      )
                    : ""
                }

            </div>

        </div>


        <button
            class="task-action schedule-action"
            title="Change schedule"
            aria-label="Change schedule"
        >
            ↻
        </button>


        <button
            class="task-action snooze-action"
            title="Snooze until tomorrow"
            aria-label="Snooze until tomorrow"
        >
            ◷
        </button>


        <button
            class="task-action delete delete-action"
            title="Delete permanently"
            aria-label="Delete permanently"
        >
            ×
        </button>

    `;


    const checkbox =
        element.querySelector(
            ".checkbox"
        );


    checkbox.addEventListener(
        "change",
        () => {

            toggleItem(
                item.id
            );

        }
    );


    element
        .querySelector(
            ".item-name"
        )
        .addEventListener(
            "click",
            () => {

                openEditModal(
                    item.id
                );

            }
        );


    element
        .querySelector(
            ".schedule-action"
        )
        .addEventListener(
            "click",
            () => {

                toggleSchedulePanel(
                    item.id
                );

            }
        );


    element
        .querySelector(
            ".snooze-action"
        )
        .addEventListener(
            "click",
            () => {

                snoozeItem(
                    item.id
                );

            }
        );


    element
        .querySelector(
            ".delete-action"
        )
        .addEventListener(
            "click",
            () => {

                deleteItem(
                    item.id
                );

            }
        );


    const schedulePanel =
        document.createElement(
            "div"
        );


    schedulePanel.className =
        "schedule-panel";


    schedulePanel.id =
        "schedule-" +
        item.id;


    schedulePanel.innerHTML =
        createSchedulePicker(
            item
        );


    wrapper.appendChild(
        element
    );


    wrapper.appendChild(
        schedulePanel
    );


    list.appendChild(
        wrapper
    );


    attachDragHandlers(
        wrapper,
        item.id
    );

}


/* ==================================================
   SCHEDULE PANEL
   ================================================== */

function toggleSchedulePanel(
    id
) {

    const panel =
        document.getElementById(
            "schedule-" + id
        );


    if (!panel) {

        return;

    }


    const wasOpen =
        panel.classList.contains(
            "open"
        );


    document
        .querySelectorAll(
            ".schedule-panel"
        )
        .forEach(
            otherPanel => {

                otherPanel.classList.remove(
                    "open"
                );

            }
        );


    if (!wasOpen) {

        panel.classList.add(
            "open"
        );

    }

}


/* ==================================================
   SCHEDULE PICKER
   ================================================== */

function createSchedulePicker(
    item
) {

    const days = [

        {
            value: "everyday",
            label: "Every day"
        },

        {
            value: 1,
            label: "Mon"
        },

        {
            value: 2,
            label: "Tue"
        },

        {
            value: 3,
            label: "Wed"
        },

        {
            value: 4,
            label: "Thu"
        },

        {
            value: 5,
            label: "Fri"
        },

        {
            value: 6,
            label: "Sat"
        },

        {
            value: 0,
            label: "Sun"
        }

    ];


    return `

        <div class="schedule-title">
            Repeat
        </div>

        <div class="schedule-options">

            ${days.map(
                day => {

                    const selected =
                        item.schedule.includes(
                            day.value
                        );


                    return `

                        <button
                            class="day-button ${
                                selected
                                ? "selected"
                                : ""
                            }"
                            onclick="
                                toggleSchedule(
                                    '${item.id}',
                                    '${day.value}'
                                )
                            "
                        >
                            ${day.label}
                        </button>

                    `;

                }
            ).join("")}

        </div>

    `;

}


/* ==================================================
   CHANGE SCHEDULE
   ================================================== */

function toggleSchedule(
    id,
    value
) {

    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    if (
        value !== "everyday"
    ) {

        value =
            Number(value);

    }


    if (
        value === "everyday"
    ) {

        item.schedule =
            ["everyday"];

    } else {

        if (
            item.schedule.includes(
                "everyday"
            )
        ) {

            item.schedule =
                [value];

        } else if (
            item.schedule.includes(
                value
            )
        ) {

            item.schedule =
                item.schedule.filter(
                    day =>
                        day !== value
                );

        } else {

            item.schedule.push(
                value
            );

        }


        if (
            item.schedule.length === 0
        ) {

            item.schedule =
                ["everyday"];

        }

    }


    saveData();


    const panel =
        document.getElementById(
            "schedule-" + id
        );


    if (panel) {

        panel.innerHTML =
            createSchedulePicker(
                item
            );

        panel.classList.add(
            "open"
        );

    }

}


/* ==================================================
   COMPLETE
   ================================================== */

function toggleItem(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    if (
        item.completed
    ) {

        item.completed =
            false;

        item.completedAt =
            null;

    } else {

        item.completed =
            true;

        item.completedAt =
            new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour:
                            "numeric",

                        minute:
                            "2-digit"
                    }
                );

    }


    saveData();

    render();

}


/* ==================================================
   SNOOZE
   ================================================== */

function snoozeItem(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    item.snoozed =
        true;


    item.snoozedUntil =
        todayKey();


    saveData();

    render();

}


/* ==================================================
   DRAG / REORDER
   ================================================== */

function attachDragHandlers(
    wrapper,
    id
) {

    let holdTimer =
        null;


    let pointerDown =
        false;


    let startY =
        0;


    wrapper.addEventListener(
        "pointerdown",
        event => {

            if (
                event.target.closest(
                    "button"
                ) ||
                event.target.closest(
                    "input"
                ) ||
                event.target.closest(
                    ".item-name"
                )
            ) {

                return;

            }


            pointerDown =
                true;

            startY =
                event.clientY;


            holdTimer =
                setTimeout(
                    () => {

                        if (
                            pointerDown
                        ) {

                            beginDrag(
                                wrapper,
                                id,
                                event.clientY
                            );

                        }

                    },
                    420
                );

        }
    );


    wrapper.addEventListener(
        "pointermove",
        event => {

            if (
                dragState.active
            ) {

                moveDrag(
                    event.clientY
                );

                return;

            }


            if (
                pointerDown &&
                Math.abs(
                    event.clientY -
                    startY
                ) > 10
            ) {

                clearTimeout(
                    holdTimer
                );

            }

        }
    );


    wrapper.addEventListener(
        "pointerup",
        () => {

            pointerDown =
                false;

            clearTimeout(
                holdTimer
            );


            if (
                dragState.active
            ) {

                finishDrag();

            }

        }
    );


    wrapper.addEventListener(
        "pointercancel",
        () => {

            pointerDown =
                false;

            clearTimeout(
                holdTimer
            );


            if (
                dragState.active
            ) {

                cancelDrag();

            }

        }
    );

}


function beginDrag(
    wrapper,
    id,
    y
) {

    dragState.id =
        id;

    dragState.wrapper =
        wrapper;

    dragState.startY =
        y;

    dragState.active =
        true;


    wrapper.classList.add(
        "dragging"
    );


    if (
        navigator.vibrate
    ) {

        navigator.vibrate(
            30
        );

    }

}


function moveDrag(
    y
) {

    if (
        !dragState.active ||
        !dragState.wrapper
    ) {

        return;

    }


    const wrapper =
        dragState.wrapper;


    const list =
        wrapper.parentElement;


    const siblings =
        Array.from(
            list.children
        ).filter(
            child =>
                child !== wrapper &&
                child.classList.contains(
                    "task-wrapper"
                )
        );


    siblings.forEach(
        sibling => {

            sibling.classList.remove(
                "drag-over"
            );

        }
    );


    let closest =
        null;

    let closestDistance =
        Infinity;


    siblings.forEach(
        sibling => {

            const rect =
                sibling.getBoundingClientRect();


            const center =
                rect.top +
                rect.height / 2;


            const distance =
                Math.abs(
                    y - center
                );


            if (
                distance <
                closestDistance
            ) {

                closestDistance =
                    distance;

                closest =
                    sibling;

            }

        }
    );


    if (!closest) {

        return;

    }


    const rect =
        closest.getBoundingClientRect();


    if (
        y <
        rect.top +
        rect.height / 2
    ) {

        list.insertBefore(
            wrapper,
            closest
        );

    } else {

        list.insertBefore(
            wrapper,
            closest.nextSibling
        );

    }


    closest.classList.add(
        "drag-over"
    );

}


function finishDrag() {

    if (
        !dragState.wrapper
    ) {

        return;

    }


    const wrapper =
        dragState.wrapper;


    wrapper.classList.remove(
        "dragging"
    );


    document
        .querySelectorAll(
            ".drag-over"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "drag-over"
                );

            }
        );


    saveCurrentVisualOrder();


    dragState.id =
        null;

    dragState.wrapper =
        null;

    dragState.active =
        false;

}


function cancelDrag() {

    if (
        dragState.wrapper
    ) {

        dragState.wrapper.classList.remove(
            "dragging"
        );

    }


    document
        .querySelectorAll(
            ".drag-over"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "drag-over"
                );

            }
        );


    dragState.id =
        null;

    dragState.wrapper =
        null;

    dragState.active =
        false;


    render();

}


function saveCurrentVisualOrder() {

    const wrappers =
        document.querySelectorAll(
            ".time-section .task-wrapper"
        );


    wrappers.forEach(
        wrapper => {

            const id =
                wrapper.dataset.id;


            const item =
                data.items.find(
                    item =>
                        item.id === id
                );


            if (!item) {

                return;

            }


            const section =
                wrapper.closest(
                    ".time-section"
                );


            const heading =
                section
                    ? section
                        .querySelector(
                            ".time-heading"
                        )
                    : null;


            if (!heading) {

                return;

            }


            const periodText =
                heading.textContent
                    .trim()
                    .toLowerCase();


            if (
                periodText ===
                "morning"
            ) {

                item.period =
                    "morning";

            } else if (
                periodText ===
                "afternoon"
            ) {

                item.period =
                    "afternoon";

            } else if (
                periodText ===
                "night"
            ) {

                item.period =
                    "night";

            }

        }
    );


    const periods = [

        "morning",
        "afternoon",
        "night"

    ];


    periods.forEach(
        period => {

            const wrappers =
                Array.from(
                    document.querySelectorAll(
                        ".time-section"
                    )
                )
                .filter(
                    section =>
                        section
                            .querySelector(
                                ".time-heading"
                            )
                            ?.textContent
                            .trim()
                            .toLowerCase()
                            === period
                )
                .flatMap(
                    section =>
                        Array.from(
                            section.querySelectorAll(
                                ".task-wrapper"
                            )
                        )
                );


            wrappers.forEach(
                (wrapper, index) => {

                    const item =
                        data.items.find(
                            item =>
                                item.id ===
                                wrapper.dataset.id
                        );


                    if (item) {

                        item.order =
                            index;

                    }

                }
            );

        }
    );


    normalizeOrders();

    saveData();

}


/* ==================================================
   EDIT TASK MODAL
   ================================================== */

function openEditModal(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    editingItemId =
        id;


    document.getElementById(
        "editTaskName"
    ).value =
        item.text;


    document.getElementById(
        "editTaskDetails"
    ).value =
        item.details || "";


    document.getElementById(
        "editModal"
    ).classList.add(
        "open"
    );

}


/* ==================================================
   SAVE EDIT
   ================================================== */

function saveEditModal() {

    if (
        !editingItemId
    ) {

        return;

    }


    const item =
        data.items.find(
            item =>
                item.id ===
                editingItemId
        );


    if (!item) {

        closeEditModal();

        return;

    }


    const nameInput =
        document.getElementById(
            "editTaskName"
        );


    const detailsInput =
        document.getElementById(
            "editTaskDetails"
        );


    const newName =
        nameInput.value.trim();


    if (
        newName === ""
    ) {

        nameInput.focus();

        return;

    }


    item.text =
        newName;


    item.details =
        detailsInput.value.trim();


    saveData();

    closeEditModal();

    render();

}


/* ==================================================
   CLOSE MODAL
   ================================================== */

function closeEditModal() {

    document
        .getElementById(
            "editModal"
        )
        .classList.remove(
            "open"
        );


    editingItemId =
        null;

}


/* ==================================================
   BACKDROP
   ================================================== */

function handleBackdropClick(
    event
) {

    if (
        event.target.id ===
        "editModal"
    ) {

        closeEditModal();

    }

}


/* ==================================================
   ADD TASK
   ================================================== */

function addItem() {

    checkForNewDay();


    const period =
        getTimePeriod();


    const periodItems =
        data.items.filter(
            item =>
                item.period ===
                period
        );


    const newItem = {

        id:
            createId(),

        text:
            "New Routine Item",

        details:
            "",

        completed:
            false,

        completedAt:
            null,

        snoozed:
            false,

        snoozedUntil:
            null,

        schedule:
            ["everyday"],

        period:
            period,

        order:
            periodItems.length

    };


    data.items.push(
        newItem
    );


    saveData();

    render();


    openEditModal(
        newItem.id
    );

}


/* ==================================================
   DELETE
   ================================================== */

function deleteItem(
    id
) {

    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    data.items =
        data.items.filter(
            item =>
                item.id !== id
        );


    normalizeOrders();

    saveData();

    render();

}


/* ==================================================
   PROGRESS
   ================================================== */

function updateProgress() {

    const visibleItems =
        getVisibleItems();


    const total =
        visibleItems.length;


    const completed =
        visibleItems.filter(
            item =>
                item.completed
        ).length;


    const progress =
        document.getElementById(
            "progress"
        );


    if (
        total === 0
    ) {

        progress.innerHTML =
            "";

        return;

    }


    progress.innerHTML =

        `<strong>${completed}</strong>
         of ${total} completed`;

}


/* ==================================================
   RESET TODAY
   ================================================== */

function resetToday() {

    checkForNewDay();


    if (
        !confirm(
            "Reset all of today's completed and snoozed items?"
        )
    ) {

        return;

    }


    data.items.forEach(
        item => {

            item.completed =
                false;

            item.completedAt =
                null;

            item.snoozed =
                false;

            item.snoozedUntil =
                null;

        }
    );


    saveData();

    render();

}


/* ==================================================
   DATE DISPLAY
   ================================================== */

function updateDate() {

    const date =
        new Date();


    document.getElementById(
        "date"
    ).textContent =

        date.toLocaleDateString(
            [],
            {
                weekday:
                    "long",

                month:
                    "long",

                day:
                    "numeric"
            }
        );

}


/* ==================================================
   ESCAPE HTML
   ================================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* ==================================================
   START
   ================================================== */

checkForNewDay();

updateDate();

render();


/*
 * Keep the time-of-day display current
 * if the app remains open across noon
 * or 5:00 PM.
 */

setInterval(
    () => {

        updateDate();

        render();

    },
    60000
);

</script>
