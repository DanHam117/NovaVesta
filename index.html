<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="NovaVesta"
>

<meta
    name="theme-color"
    content="#07100b"
>

<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<title>NovaVesta</title>


<style>

/* ==================================================
   NOVAVESTA — VIRIDITAS VESTAE
   ================================================== */

:root {

    --bg: #07100b;
    --panel: #0d1a12;
    --panel-active: #102319;
    --panel-light: #13271b;

    --green: #55d68a;
    --green-bright: #7affad;
    --green-dim: #347a50;

    --text: #edf8f0;
    --muted: #789080;

    --border:
        rgba(85, 214, 138, 0.17);

    --danger: #d86b6b;

    --glow:
        0 0 18px
        rgba(85, 214, 138, 0.18);
}


* {

    box-sizing: border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html {

    background: var(--bg);

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;

    min-height: 100%;

}


body {

    margin: 0;

    min-height: 100vh;
    min-height: 100dvh;

    overflow-x: hidden;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(44, 130, 76, 0.18),
            transparent 45%
        ),

        var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    touch-action: manipulation;

}


/* ==================================================
   APP
   ================================================== */

.app {

    width: 100%;

    max-width: 680px;

    margin: 0 auto;

    padding-top:
        max(22px, env(safe-area-inset-top));

    padding-left:
        max(18px, env(safe-area-inset-left));

    padding-right:
        max(18px, env(safe-area-inset-right));

    padding-bottom:
        calc(
            40px +
            env(safe-area-inset-bottom)
        );

}


/* ==================================================
   HEADER
   ================================================== */

header {

    text-align: center;

    padding-top: 8px;

    margin-bottom: 24px;

}


.flame {

    font-size: 25px;

    color:
        var(--green-bright);

    text-shadow:
        0 0 15px
        rgba(122, 255, 173, 0.5);

    margin-bottom: 4px;

}


h1 {

    margin: 0;

    font-size: 29px;

    line-height: 1.15;

    font-weight: 600;

    letter-spacing: -0.4px;

}


.date {

    margin-top: 7px;

    color: var(--muted);

    font-size: 14px;

}


/* ==================================================
   PROGRESS
   ================================================== */

.progress {

    text-align: center;

    margin-bottom: 20px;

    color: var(--muted);

    font-size: 14px;

}


.progress strong {

    color: var(--green);

}


/* ==================================================
   TIME-OF-DAY SECTION
   ================================================== */

.time-section {

    margin-bottom: 22px;

}


.section-heading {

    margin:

        0

        0

        9px

        3px;

    color: var(--muted);

    font-size: 12px;

    font-weight: 600;

    letter-spacing: 1.2px;

    text-transform: uppercase;

}


/* ==================================================
   ROUTINE
   ================================================== */

.routine {

    display: flex;

    flex-direction: column;

    gap: 9px;

}


/* ==================================================
   TASK
   ================================================== */

.task-wrapper {

    width: 100%;

}


.item {

    display: flex;

    align-items: center;

    gap: 10px;

    width: 100%;

    min-height: 68px;

    padding:
        12px
        7px
        12px
        14px;

    background:
        rgba(13, 26, 18, 0.96);

    border:
        1px solid var(--border);

    border-radius: 14px;

    transition:
        background 0.15s ease,
        border-color 0.15s ease,
        opacity 0.15s ease;

}


.item:active {

    background:
        var(--panel-active);

    border-color:
        rgba(85, 214, 138, 0.32);

}


.item.completed {

    opacity: 0.67;

}


/* ==================================================
   CHECKBOX
   ================================================== */

.checkbox {

    appearance: none;

    -webkit-appearance: none;

    width: 30px;
    height: 30px;

    min-width: 30px;

    margin: 0;

    border:
        2px solid
        var(--green-dim);

    border-radius: 9px;

    background: transparent;

    position: relative;

    cursor: pointer;

}


.checkbox::before {

    content: "";

    position: absolute;

    inset: -10px;

}


.checkbox:checked {

    background:
        var(--green);

    border-color:
        var(--green);

    box-shadow:
        0 0 14px
        rgba(85, 214, 138, 0.32);

}


.checkbox:checked::after {

    content: "✓";

    position: absolute;

    left: 4px;

    top: -1px;

    color: #07100b;

    font-size: 21px;

    font-weight: 800;

}


/* ==================================================
   TASK CONTENT
   ================================================== */

.item-content {

    flex: 1;

    min-width: 0;

}


.item-name {

    font-size: 17px;

    line-height: 1.3;

    font-weight: 450;

    word-break: break-word;

    cursor: pointer;

}


.item-name:active {

    color:
        var(--green);

}


.completed .item-name {

    text-decoration: line-through;

    color: #91a598;

}


.timestamp {

    margin-top: 3px;

    min-height: 15px;

    color:
        var(--green-dim);

    font-size: 12px;

}


/* ==================================================
   TASK BUTTONS
   ================================================== */

.task-action {

    width: 32px;
    height: 32px;

    min-width: 32px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;

    background: transparent;

    border: none;

    border-radius: 50%;

    color: #52675a;

    cursor: pointer;

    font-size: 17px;

}


.task-action:active {

    background:
        rgba(85, 214, 138, 0.12);

    color:
        var(--green);

}


.delete {

    color: #405247;

    font-size: 21px;

}


.delete:active {

    background:
        rgba(216, 107, 107, 0.10);

    color:
        var(--danger);

}


/* ==================================================
   SCHEDULE PANEL
   ================================================== */

.schedule-panel {

    display: none;

    margin-top: 5px;

    padding: 12px;

    background:
        var(--panel);

    border:
        1px solid var(--border);

    border-radius: 12px;

    box-shadow:
        var(--glow);

}


.schedule-panel.open {

    display: block;

}


.schedule-title {

    margin-bottom: 9px;

    color: var(--muted);

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 0.6px;

}


.schedule-options {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

}


.day-button {

    min-height: 36px;

    padding:
        7px 11px;

    border:
        1px solid
        rgba(85, 214, 138, 0.14);

    border-radius: 9px;

    background:
        rgba(85, 214, 138, 0.04);

    color: var(--muted);

    font-size: 13px;

    cursor: pointer;

}


.day-button.selected {

    background:
        rgba(85, 214, 138, 0.16);

    border-color:
        var(--green-dim);

    color:
        var(--green);

}


.day-button:active {

    transform: scale(0.97);

}


/* ==================================================
   ADD BUTTON
   ================================================== */

.controls {

    display: flex;

    justify-content: center;

    margin-top: 18px;

}


.add-button {

    min-height: 46px;

    padding:
        10px 18px;

    border-radius: 12px;

    border:
        1px solid var(--border);

    background:
        rgba(85, 214, 138, 0.07);

    color:
        var(--green);

    font-size: 15px;

    cursor: pointer;

}


.add-button:active {

    background:
        rgba(85, 214, 138, 0.16);

    transform: scale(0.98);

}


/* ==================================================
   SETTINGS
   ================================================== */

.settings {

    margin-top: 27px;

    padding-top: 17px;

    border-top:
        1px solid
        rgba(85, 214, 138, 0.08);

    text-align: center;

}


.settings button {

    min-height: 40px;

    padding:
        8px 14px;

    background: none;

    border: none;

    color: #52675a;

    font-size: 13px;

}


/* ==================================================
   EMPTY
   ================================================== */

.empty {

    text-align: center;

    color: var(--muted);

    padding:
        34px 20px;

    border:
        1px dashed var(--border);

    border-radius: 14px;

    line-height: 1.5;

}


/* ==================================================
   EDIT MODAL
   ================================================== */

.modal-backdrop {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: flex-end;

    justify-content: center;

    padding:
        18px
        18px
        max(
            18px,
            env(safe-area-inset-bottom)
        );

    background:
        rgba(0, 0, 0, 0.68);

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

}


.modal-backdrop.open {

    display: flex;

}


.modal {

    width: 100%;

    max-width: 600px;

    background:
        #0d1a12;

    border:
        1px solid
        rgba(85, 214, 138, 0.22);

    border-radius: 20px;

    padding:
        20px;

    box-shadow:

        0 0 30px
        rgba(85, 214, 138, 0.15),

        0 -10px 50px
        rgba(0, 0, 0, 0.4);

    animation:
        modalIn 0.18s ease-out;

}


@keyframes modalIn {

    from {

        transform:
            translateY(20px);

        opacity: 0;

    }

    to {

        transform:
            translateY(0);

        opacity: 1;

    }

}


.modal-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;

}


.modal-title {

    margin: 0;

    font-size: 21px;

    font-weight: 600;

}


.modal-close {

    width: 36px;
    height: 36px;

    border: none;

    border-radius: 50%;

    background:
        rgba(85, 214, 138, 0.06);

    color:
        var(--muted);

    font-size: 23px;

    line-height: 1;

}


.modal-close:active {

    background:
        rgba(85, 214, 138, 0.15);

    color:
        var(--green);

}


.form-group {

    margin-bottom: 16px;

}


.form-label {

    display: block;

    margin-bottom: 7px;

    color:
        var(--muted);

    font-size: 13px;

}


.form-input,
.form-textarea,
.form-select {

    width: 100%;

    border:
        1px solid
        rgba(85, 214, 138, 0.18);

    border-radius: 11px;

    background:
        #07100b;

    color:
        var(--text);

    font-family: inherit;

    font-size: 16px;

    outline: none;

}


.form-input {

    height: 48px;

    padding:
        0 13px;

}


.form-textarea {

    min-height: 110px;

    resize: vertical;

    padding:
        12px 13px;

    line-height: 1.45;

}


.form-select {

    height: 48px;

    padding:
        0 13px;

}


.form-input:focus,
.form-textarea:focus,
.form-select:focus {

    border-color:
        var(--green-dim);

    box-shadow:
        0 0 12px
        rgba(85, 214, 138, 0.12);

}


.modal-actions {

    display: flex;

    gap: 10px;

    margin-top: 20px;

}


.modal-button {

    flex: 1;

    min-height: 48px;

    border-radius: 11px;

    font-size: 15px;

    font-weight: 500;

}


.modal-cancel {

    background:
        rgba(85, 214, 138, 0.05);

    border:
        1px solid
        var(--border);

    color:
        var(--muted);

}


.modal-save {

    background:
        rgba(85, 214, 138, 0.15);

    border:
        1px solid
        var(--green-dim);

    color:
        var(--green-bright);

}


.modal-button:active {

    transform:
        scale(0.98);

}


/* ==================================================
   SMALL IPHONES
   ================================================== */

@media (max-width: 375px) {

    .app {

        padding-left:
            max(
                14px,
                env(safe-area-inset-left)
            );

        padding-right:
            max(
                14px,
                env(safe-area-inset-right)
            );

    }


    h1 {

        font-size: 27px;

    }


    .item {

        min-height: 64px;

        gap: 8px;

    }


    .item-name {

        font-size: 16px;

    }


    .checkbox {

        width: 28px;
        height: 28px;

        min-width: 28px;

    }


    .task-action {

        width: 30px;
        height: 30px;

        min-width: 30px;

    }

}


/* ==================================================
   DESKTOP
   ================================================== */

@media (min-width: 700px) {

    .app {

        padding-top: 50px;

        padding-left: 20px;
        padding-right: 20px;

    }


    h1 {

        font-size: 32px;

    }


    .item {

        padding:
            17px
            10px
            17px
            18px;

    }


    .item:hover {

        background:
            #112219;

        border-color:
            rgba(85, 214, 138, 0.30);

        box-shadow:
            var(--glow);

    }

}

</style>

</head>


<body>


<div class="app">


<header>

    <div class="flame">✦</div>

    <h1>NovaVesta</h1>

    <div
        class="date"
        id="date"
    ></div>

</header>


<div
    class="progress"
    id="progress"
></div>


<main
    id="routine"
></main>


<div class="controls">

    <button
        class="add-button"
        onclick="addItem()"
    >
        + Add routine item
    </button>

</div>


<div class="settings">

    <button
        onclick="resetToday()"
    >
        Reset today's checklist
    </button>

</div>


</div>


<!-- ==================================================
     EDIT TASK MODAL
     ================================================== -->

<div
    class="modal-backdrop"
    id="editModal"
    onclick="handleBackdropClick(event)"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >

        <div class="modal-header">

            <h2
                class="modal-title"
                id="modalTitle"
            >
                Edit Task
            </h2>

            <button
                class="modal-close"
                onclick="closeEditModal()"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="editTaskName"
            >
                Task name
            </label>

            <input
                class="form-input"
                id="editTaskName"
                type="text"
                autocomplete="off"
            >

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="editTaskDetails"
            >
                Details
            </label>

            <textarea
                class="form-textarea"
                id="editTaskDetails"
                placeholder="Optional notes about this task..."
            ></textarea>

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="editTaskPeriod"
            >
                Time of day
            </label>

            <select
                class="form-select"
                id="editTaskPeriod"
            >

                <option value="morning">
                    Morning
                </option>

                <option value="afternoon">
                    Afternoon
                </option>

                <option value="night">
                    Night
                </option>

            </select>

        </div>


        <div class="modal-actions">

            <button
                class="modal-button modal-cancel"
                onclick="closeEditModal()"
            >
                Cancel
            </button>

            <button
                class="modal-button modal-save"
                onclick="saveEditModal()"
            >
                Save
            </button>

        </div>

    </div>

</div>


<script>

/* ==================================================
   STORAGE
   ================================================== */

const STORAGE_KEY =
    "novavesta-morning-routine";


const DEFAULT_ITEMS = [

    {
        text: "Get dressed",
        period: "morning"
    },

    {
        text: "Brush teeth",
        period: "morning"
    },

    {
        text: "Take medications / vitamins",
        period: "morning"
    },

    {
        text: "Eat breakfast",
        period: "morning"
    },

    {
        text: "Pack everything I need",
        period: "morning"
    },

    {
        text: "Check today's schedule",
        period: "morning"
    },

    {
        text: "Leave for the day",
        period: "morning"
    }

];


let data =
    loadData();


let editingItemId =
    null;


/* ==================================================
   DATE
   ================================================== */

function todayKey() {

    const now =
        new Date();

    return [

        now.getFullYear(),

        String(
            now.getMonth() + 1
        ).padStart(2, "0"),

        String(
            now.getDate()
        ).padStart(2, "0")

    ].join("-");

}


function currentDay() {

    return new Date().getDay();

}


/* ==================================================
   CURRENT TIME PERIOD
   ================================================== */

function currentPeriod() {

    const now =
        new Date();

    const hour =
        now.getHours();


    /*
     * Morning:
     * 2:00 AM through 11:59 AM
     */

    if (
        hour >= 2 &&
        hour < 12
    ) {

        return "morning";

    }


    /*
     * Afternoon:
     * 12:00 PM through 4:59 PM
     */

    if (
        hour >= 12 &&
        hour < 17
    ) {

        return "afternoon";

    }


    /*
     * Night:
     * 5:00 PM through 1:59 AM
     */

    return "night";

}


/* ==================================================
   PERIOD ORDER
   ================================================== */

function getPeriodOrder() {

    const current =
        currentPeriod();


    if (
        current === "morning"
    ) {

        return [
            "morning",
            "afternoon",
            "night"
        ];

    }


    if (
        current === "afternoon"
    ) {

        return [
            "afternoon",
            "morning",
            "night"
        ];

    }


    return [
        "night",
        "afternoon",
        "morning"
    ];

}


/* ==================================================
   PERIOD LABEL
   ================================================== */

function periodLabel(
    period
) {

    if (
        period === "morning"
    ) {

        return "Morning";

    }


    if (
        period === "afternoon"
    ) {

        return "Afternoon";

    }


    return "Night";

}


/* ==================================================
   LOAD DATA
   ================================================== */

function loadData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (saved) {

        try {

            const parsed =
                JSON.parse(saved);


            if (
                parsed &&
                Array.isArray(
                    parsed.items
                )
            ) {

                parsed.items.forEach(
                    item => {

                        if (
                            typeof item.completed !==
                            "boolean"
                        ) {

                            item.completed =
                                false;

                        }


                        if (
                            typeof item.completedAt ===
                            "undefined"
                        ) {

                            item.completedAt =
                                null;

                        }


                        if (
                            typeof item.snoozed !==
                            "boolean"
                        ) {

                            item.snoozed =
                                false;

                        }


                        if (
                            typeof item.snoozedUntil ===
                            "undefined"
                        ) {

                            item.snoozedUntil =
                                null;

                        }


                        if (
                            typeof item.details !==
                            "string"
                        ) {

                            item.details =
                                "";

                        }


                        if (
                            !Array.isArray(
                                item.schedule
                            )
                        ) {

                            item.schedule =
                                ["everyday"];

                        }


                        /*
                         * Existing NovaVesta
                         * tasks did not have
                         * a time period.
                         *
                         * Put those tasks
                         * into Morning.
                         */

                        if (
                            item.period !== "morning" &&
                            item.period !== "afternoon" &&
                            item.period !== "night"
                        ) {

                            item.period =
                                "morning";

                        }

                    }
                );


                if (
                    !parsed.date
                ) {

                    parsed.date =
                        todayKey();

                }


                return parsed;

            }

        } catch (error) {

            console.error(
                "NovaVesta could not read saved data:",
                error
            );

        }

    }


    return {

        date:
            todayKey(),

        items:
            DEFAULT_ITEMS.map(
                item => ({

                    id:
                        createId(),

                    text:
                        item.text,

                    details:
                        "",

                    period:
                        item.period,

                    completed:
                        false,

                    completedAt:
                        null,

                    snoozed:
                        false,

                    snoozedUntil:
                        null,

                    schedule:
                        ["everyday"]

                })
            )

    };

}


/* ==================================================
   ID
   ================================================== */

function createId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();

    }


    return (

        Date.now().toString(36) +

        Math.random()
            .toString(36)
            .substring(2)

    );

}


/* ==================================================
   SAVE
   ================================================== */

function saveData() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(data)

    );

}


/* ==================================================
   NEW DAY
   ================================================== */

function checkForNewDay() {

    const today =
        todayKey();


    if (
        data.date === today
    ) {

        return;

    }


    data.date =
        today;


    data.items.forEach(
        item => {

            item.completed =
                false;

            item.completedAt =
                null;

            item.snoozed =
                false;

            item.snoozedUntil =
                null;

        }
    );


    saveData();

}


/* ==================================================
   SCHEDULE
   ================================================== */

function isScheduledToday(
    item
) {

    if (
        !Array.isArray(
            item.schedule
        ) ||
        item.schedule.length === 0
    ) {

        return true;

    }


    if (
        item.schedule.includes(
            "everyday"
        )
    ) {

        return true;

    }


    return item.schedule.includes(
        currentDay()
    );

}


/* ==================================================
   VISIBLE ITEMS
   ================================================== */

function getVisibleItems(
    period
) {

    return data.items.filter(

        item =>

            item.period === period &&

            isScheduledToday(item) &&

            !item.snoozed

    );

}


/* ==================================================
   RENDER
   ================================================== */

function render() {

    checkForNewDay();


    const routine =
        document.getElementById(
            "routine"
        );


    routine.innerHTML =
        "";


    const order =
        getPeriodOrder();


    order.forEach(
        period => {

            const items =
                getVisibleItems(
                    period
                );


            /*
             * Do not display completely
             * empty sections.
             */

            if (
                items.length === 0
            ) {

                return;

            }


            renderSection(
                period,
                items,
                routine
            );

        }
    );


    updateProgress();

}


/* ==================================================
   RENDER SECTION
   ================================================== */

function renderSection(
    period,
    items,
    routine
) {

    const section =
        document.createElement(
            "section"
        );


    section.className =
        "time-section";


    const heading =
        document.createElement(
            "h2"
        );


    heading.className =
        "section-heading";


    heading.textContent =
        periodLabel(period);


    section.appendChild(
        heading
    );


    const list =
        document.createElement(
            "div"
        );


    list.className =
        "routine";


    items.forEach(
        item => {

            renderItem(
                item,
                list
            );

        }
    );


    section.appendChild(
        list
    );


    routine.appendChild(
        section
    );

}


/* ==================================================
   RENDER TASK
   ================================================== */

function renderItem(
    item,
    routine
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "task-wrapper";


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "item" +

        (
            item.completed
            ? " completed"
            : ""
        );


    element.innerHTML = `

        <input
            class="checkbox"
            type="checkbox"
            ${item.completed ? "checked" : ""}
            onchange="
                toggleItem('${item.id}')
            "
            aria-label="Complete task"
        >


        <div class="item-content">

            <div
                class="item-name"
                onclick="
                    openEditModal(
                        '${item.id}'
                    )
                "
            >
                ${escapeHtml(item.text)}
            </div>


            <div class="timestamp">

                ${
                    item.completed
                    ? "Completed at " +
                      escapeHtml(
                          item.completedAt
                      )
                    : ""
                }

            </div>

        </div>


        <button
            class="task-action"
            onclick="
                toggleSchedulePanel(
                    '${item.id}'
                )
            "
            title="Change schedule"
            aria-label="Change schedule"
        >
            ↻
        </button>


        <button
            class="task-action"
            onclick="
                snoozeItem(
                    '${item.id}'
                )
            "
            title="Snooze until tomorrow"
            aria-label="Snooze until tomorrow"
        >
            ◷
        </button>


        <button
            class="task-action delete"
            onclick="
                deleteItem(
                    '${item.id}'
                )
            "
            title="Delete permanently"
            aria-label="Delete permanently"
        >
            ×
        </button>

    `;


    const schedulePanel =
        document.createElement(
            "div"
        );


    schedulePanel.className =
        "schedule-panel";


    schedulePanel.id =
        "schedule-" +
        item.id;


    schedulePanel.innerHTML =
        createSchedulePicker(
            item
        );


    wrapper.appendChild(
        element
    );


    wrapper.appendChild(
        schedulePanel
    );


    routine.appendChild(
        wrapper
    );

}


/* ==================================================
   SCHEDULE PICKER
   ================================================== */

function createSchedulePicker(
    item
) {

    const days = [

        {
            value: "everyday",
            label: "Every day"
        },

        {
            value: 1,
            label: "Mon"
        },

        {
            value: 2,
            label: "Tue"
        },

        {
            value: 3,
            label: "Wed"
        },

        {
            value: 4,
            label: "Thu"
        },

        {
            value: 5,
            label: "Fri"
        },

        {
            value: 6,
            label: "Sat"
        },

        {
            value: 0,
            label: "Sun"
        }

    ];


    return `

        <div class="schedule-title">
            Repeat
        </div>


        <div class="schedule-options">

            ${days.map(
                day => {

                    const selected =
                        item.schedule.includes(
                            day.value
                        );


                    return `

                        <button
                            class="day-button ${
                                selected
                                ? "selected"
                                : ""
                            }"
                            onclick="
                                toggleSchedule(
                                    '${item.id}',
                                    '${day.value}'
                                )
                            "
                        >
                            ${day.label}
                        </button>

                    `;

                }
            ).join("")}

        </div>

    `;

}


/* ==================================================
   SCHEDULE PANEL
   ================================================== */

function toggleSchedulePanel(
    id
) {

    const panel =
        document.getElementById(
            "schedule-" + id
        );


    if (!panel) {

        return;

    }


    const wasOpen =
        panel.classList.contains(
            "open"
        );


    document
        .querySelectorAll(
            ".schedule-panel"
        )
        .forEach(
            panel => {

                panel.classList.remove(
                    "open"
                );

            }
        );


    if (!wasOpen) {

        panel.classList.add(
            "open"
        );

    }

}


/* ==================================================
   CHANGE SCHEDULE
   ================================================== */

function toggleSchedule(
    id,
    value
) {

    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    if (
        value !== "everyday"
    ) {

        value =
            Number(value);

    }


    if (
        value === "everyday"
    ) {

        item.schedule =
            ["everyday"];

    } else {

        if (
            item.schedule.includes(
                "everyday"
            )
        ) {

            item.schedule =
                [value];

        } else if (
            item.schedule.includes(
                value
            )
        ) {

            item.schedule =
                item.schedule.filter(
                    day =>
                        day !== value
                );

        } else {

            item.schedule.push(
                value
            );

        }


        if (
            item.schedule.length === 0
        ) {

            item.schedule =
                ["everyday"];

        }

    }


    saveData();


    const panel =
        document.getElementById(
            "schedule-" + id
        );


    if (panel) {

        panel.innerHTML =
            createSchedulePicker(
                item
            );

        panel.classList.add(
            "open"
        );

    }

}


/* ==================================================
   COMPLETE
   ================================================== */

function toggleItem(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    if (
        item.completed
    ) {

        item.completed =
            false;

        item.completedAt =
            null;

    } else {

        item.completed =
            true;

        item.completedAt =
            new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour:
                            "numeric",

                        minute:
                            "2-digit"
                    }
                );

    }


    saveData();

    render();

}


/* ==================================================
   SNOOZE
   ================================================== */

function snoozeItem(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    item.snoozed =
        true;


    item.snoozedUntil =
        todayKey();


    saveData();

    render();

}


/* ==================================================
   EDIT TASK MODAL
   ================================================== */

function openEditModal(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    editingItemId =
        id;


    document.getElementById(
        "editTaskName"
    ).value =
        item.text;


    document.getElementById(
        "editTaskDetails"
    ).value =
        item.details || "";


    document.getElementById(
        "editTaskPeriod"
    ).value =
        item.period || "morning";


    document.getElementById(
        "editModal"
    ).classList.add(
        "open"
    );

}


/* ==================================================
   SAVE EDIT
   ================================================== */

function saveEditModal() {

    if (
        !editingItemId
    ) {

        return;

    }


    const item =
        data.items.find(
            item =>
                item.id ===
                editingItemId
        );


    if (!item) {

        closeEditModal();

        return;

    }


    const nameInput =
        document.getElementById(
            "editTaskName"
        );


    const detailsInput =
        document.getElementById(
            "editTaskDetails"
        );


    const periodInput =
        document.getElementById(
            "editTaskPeriod"
        );


    const newName =
        nameInput.value.trim();


    if (
        newName === ""
    ) {

        nameInput.focus();

        return;

    }


    item.text =
        newName;


    item.details =
        detailsInput.value.trim();


    item.period =
        periodInput.value;


    saveData();

    closeEditModal();

    render();

}


/* ==================================================
   CLOSE EDIT MODAL
   ================================================== */

function closeEditModal() {

    document.getElementById(
        "editModal"
    ).classList.remove(
        "open"
    );


    editingItemId =
        null;

}


/* ==================================================
   TAP OUTSIDE MODAL
   ================================================== */

function handleBackdropClick(
    event
) {

    if (
        event.target.id ===
        "editModal"
    ) {

        closeEditModal();

    }

}


/* ==================================================
   ADD TASK
   ================================================== */

function addItem() {

    checkForNewDay();


    const newItem = {

        id:
            createId(),

        text:
            "New Routine Item",

        details:
            "",

        period:
            currentPeriod(),

        completed:
            false,

        completedAt:
            null,

        snoozed:
            false,

        snoozedUntil:
            null,

        schedule:
            ["everyday"]

    };


    data.items.push(
        newItem
    );


    saveData();

    render();


    /*
     * Open the editor immediately so
     * the user can name the new task
     * and change its time period.
     */

    openEditModal(
        newItem.id
    );

}


/* ==================================================
   DELETE TASK
   ================================================== */

function deleteItem(
    id
) {

    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {

        return;

    }


    data.items =
        data.items.filter(
            item =>
                item.id !== id
        );


    saveData();

    render();

}


/* ==================================================
   PROGRESS
   ================================================== */

function updateProgress() {

    const visibleItems =
        data.items.filter(

            item =>

                isScheduledToday(item) &&

                !item.snoozed

        );


    const total =
        visibleItems.length;


    const completed =
        visibleItems.filter(
            item =>
                item.completed
        ).length;


    const progress =
        document.getElementById(
            "progress"
        );


    if (
        total === 0
    ) {

        progress.innerHTML =
            "";

        return;

    }


    progress.innerHTML =

        `<strong>${completed}</strong>
         of ${total} completed`;

}


/* ==================================================
   RESET TODAY
   ================================================== */

function resetToday() {

    checkForNewDay();


    if (
        !confirm(
            "Reset all of today's completed and snoozed items?"
        )
    ) {

        return;

    }


    data.items.forEach(
        item => {

            item.completed =
                false;

            item.completedAt =
                null;

            item.snoozed =
                false;

            item.snoozedUntil =
                null;

        }
    );


    saveData();

    render();

}


/* ==================================================
   DATE DISPLAY
   ================================================== */

function updateDate() {

    const date =
        new Date();


    document.getElementById(
        "date"
    ).textContent =

        date.toLocaleDateString(
            [],
            {
                weekday:
                    "long",

                month:
                    "long",

                day:
                    "numeric"
            }
        );

}


/* ==================================================
   ESCAPE HTML
   ================================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* ==================================================
   AUTOMATIC TIME UPDATE
   ================================================== */

/*
 * This does NOT constantly reset anything.
 *
 * It simply checks periodically whether
 * the current time-of-day section has changed.
 *
 * This means NovaVesta can automatically
 * move from Morning → Afternoon → Night
 * while the app is open.
 */

let lastPeriod =
    currentPeriod();


setInterval(
    () => {

        checkForNewDay();

        const period =
            currentPeriod();


        if (
            period !== lastPeriod
        ) {

            lastPeriod =
                period;

            render();

        }

    },
    30000
);


/* ==================================================
   START
   ================================================== */

checkForNewDay();

updateDate();

render();

</script>
