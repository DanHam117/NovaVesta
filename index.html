<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="NovaVesta"
>

<meta
    name="theme-color"
    content="#07100b"
>

<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<title>NovaVesta</title>


<style>

/* ==================================================
   NOVAVESTA — VIRIDITAS VESTAE
   ================================================== */

:root {
    --bg: #07100b;
    --panel: #0d1a12;
    --panel-active: #102319;
    --panel-light: #13271b;

    --green: #55d68a;
    --green-bright: #7affad;
    --green-dim: #347a50;

    --text: #edf8f0;
    --muted: #789080;

    --border: rgba(85, 214, 138, 0.17);

    --danger: #d86b6b;

    --glow:
        0 0 18px rgba(85, 214, 138, 0.18);
}


/* ==================================================
   BASIC RESET
   ================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}


html {
    background: var(--bg);

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;

    min-height: 100%;
}


body {
    margin: 0;

    min-height: 100vh;
    min-height: 100dvh;

    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(44, 130, 76, 0.18),
            transparent 45%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    touch-action: manipulation;
}


/* ==================================================
   APP CONTAINER
   ================================================== */

.app {
    width: 100%;
    max-width: 680px;

    margin: 0 auto;

    padding-top:
        max(22px, env(safe-area-inset-top));

    padding-left:
        max(18px, env(safe-area-inset-left));

    padding-right:
        max(18px, env(safe-area-inset-right));

    padding-bottom:
        calc(40px + env(safe-area-inset-bottom));
}


/* ==================================================
   HEADER
   ================================================== */

header {
    text-align: center;

    padding-top: 8px;

    margin-bottom: 24px;
}


.flame {
    font-size: 25px;

    color: var(--green-bright);

    text-shadow:
        0 0 15px rgba(122, 255, 173, 0.5);

    margin-bottom: 4px;
}


h1 {
    margin: 0;

    font-size: 29px;

    line-height: 1.15;

    font-weight: 600;

    letter-spacing: -0.4px;
}


.date {
    margin-top: 7px;

    color: var(--muted);

    font-size: 14px;
}


/* ==================================================
   PROGRESS
   ================================================== */

.progress {
    text-align: center;

    margin-bottom: 14px;

    color: var(--muted);

    font-size: 14px;
}


.progress strong {
    color: var(--green);
}


/* ==================================================
   ROUTINE LIST
   ================================================== */

.routine {
    display: flex;

    flex-direction: column;

    gap: 9px;
}


/* ==================================================
   TASK WRAPPER
   ================================================== */

.task-wrapper {
    width: 100%;
}


/* ==================================================
   TASK
   ================================================== */

.item {
    display: flex;

    align-items: center;

    gap: 10px;

    width: 100%;

    min-height: 68px;

    padding:
        12px
        7px
        12px
        14px;

    background:
        rgba(13, 26, 18, 0.96);

    border:
        1px solid var(--border);

    border-radius: 14px;

    transition:
        background 0.15s ease,
        border-color 0.15s ease,
        opacity 0.15s ease;
}


.item:active {
    background: var(--panel-active);

    border-color:
        rgba(85, 214, 138, 0.32);

    transform: scale(0.995);
}


.item.completed {
    opacity: 0.67;
}


/* ==================================================
   CHECKBOX
   ================================================== */

.checkbox {
    appearance: none;
    -webkit-appearance: none;

    width: 30px;
    height: 30px;

    min-width: 30px;

    margin: 0;

    border:
        2px solid var(--green-dim);

    border-radius: 9px;

    background: transparent;

    position: relative;

    cursor: pointer;
}


.checkbox::before {
    content: "";

    position: absolute;

    inset: -10px;
}


.checkbox:checked {
    background: var(--green);

    border-color: var(--green);

    box-shadow:
        0 0 14px
        rgba(85, 214, 138, 0.32);
}


.checkbox:checked::after {
    content: "✓";

    position: absolute;

    left: 4px;
    top: -1px;

    color: #07100b;

    font-size: 21px;

    font-weight: 800;
}


/* ==================================================
   TASK TEXT
   ================================================== */

.item-content {
    flex: 1;

    min-width: 0;
}


.item-name {
    font-size: 17px;

    line-height: 1.3;

    font-weight: 450;

    word-break: break-word;

    outline: none;

    cursor: text;
}


.completed .item-name {
    text-decoration: line-through;

    color: #91a598;
}


.timestamp {
    margin-top: 3px;

    min-height: 15px;

    color: var(--green-dim);

    font-size: 12px;
}


/* ==================================================
   TASK ACTION BUTTONS
   ================================================== */

.task-action {
    width: 32px;
    height: 32px;

    min-width: 32px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;

    background: transparent;

    border: none;

    border-radius: 50%;

    color: #52675a;

    cursor: pointer;

    font-size: 17px;
}


.task-action:active {
    background:
        rgba(85, 214, 138, 0.12);

    color: var(--green);
}


.delete {
    color: #405247;

    font-size: 21px;
}


.delete:active {
    background:
        rgba(216, 107, 107, 0.10);

    color: var(--danger);
}


/* ==================================================
   SCHEDULE PANEL
   ================================================== */

.schedule-panel {
    display: none;

    margin-top: 5px;

    padding: 12px;

    background: var(--panel);

    border:
        1px solid var(--border);

    border-radius: 12px;

    box-shadow: var(--glow);
}


.schedule-panel.open {
    display: block;
}


.schedule-title {
    margin-bottom: 9px;

    color: var(--muted);

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 0.6px;
}


.schedule-options {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;
}


.day-button {
    min-height: 36px;

    padding:
        7px 11px;

    border:
        1px solid
        rgba(85, 214, 138, 0.14);

    border-radius: 9px;

    background:
        rgba(85, 214, 138, 0.04);

    color: var(--muted);

    font-size: 13px;

    cursor: pointer;
}


.day-button.selected {
    background:
        rgba(85, 214, 138, 0.16);

    border-color:
        var(--green-dim);

    color: var(--green);
}


.day-button:active {
    transform: scale(0.97);
}


/* ==================================================
   ADD BUTTON
   ================================================== */

.controls {
    display: flex;

    justify-content: center;

    margin-top: 18px;
}


.add-button {
    min-height: 46px;

    padding:
        10px 18px;

    border-radius: 12px;

    border:
        1px solid var(--border);

    background:
        rgba(85, 214, 138, 0.07);

    color: var(--green);

    font-size: 15px;

    cursor: pointer;
}


.add-button:active {
    background:
        rgba(85, 214, 138, 0.16);

    transform: scale(0.98);
}


/* ==================================================
   SETTINGS
   ================================================== */

.settings {
    margin-top: 27px;

    padding-top: 17px;

    border-top:
        1px solid
        rgba(85, 214, 138, 0.08);

    text-align: center;
}


.settings button {
    min-height: 40px;

    padding:
        8px 14px;

    background: none;

    border: none;

    color: #52675a;

    font-size: 13px;
}


/* ==================================================
   EMPTY STATE
   ================================================== */

.empty {
    text-align: center;

    color: var(--muted);

    padding:
        34px 20px;

    border:
        1px dashed var(--border);

    border-radius: 14px;

    line-height: 1.5;
}


/* ==================================================
   SMALL IPHONES
   ================================================== */

@media (max-width: 375px) {

    .app {
        padding-left:
            max(14px, env(safe-area-inset-left));

        padding-right:
            max(14px, env(safe-area-inset-right));
    }


    h1 {
        font-size: 27px;
    }


    .item {
        min-height: 64px;

        gap: 8px;
    }


    .item-name {
        font-size: 16px;
    }


    .checkbox {
        width: 28px;
        height: 28px;

        min-width: 28px;
    }


    .task-action {
        width: 30px;
        height: 30px;

        min-width: 30px;
    }
}


/* ==================================================
   DESKTOP
   ================================================== */

@media (min-width: 700px) {

    .app {
        padding-top: 50px;

        padding-left: 20px;
        padding-right: 20px;
    }


    h1 {
        font-size: 32px;
    }


    .item {
        padding:
            17px
            10px
            17px
            18px;
    }


    .item:hover {
        background: #112219;

        border-color:
            rgba(85, 214, 138, 0.30);

        box-shadow: var(--glow);
    }
}

</style>

</head>


<body>


<div class="app">


<header>

    <div class="flame">✦</div>

    <h1>NovaVesta</h1>

    <div
        class="date"
        id="date"
    ></div>

</header>


<div
    class="progress"
    id="progress"
></div>


<main
    class="routine"
    id="routine"
></main>


<div class="controls">

    <button
        class="add-button"
        onclick="addItem()"
    >
        + Add routine item
    </button>

</div>


<div class="settings">

    <button
        onclick="resetToday()"
    >
        Reset today's checklist
    </button>

</div>


</div>


<script>

/* ==================================================
   STORAGE
   ================================================== */

const STORAGE_KEY =
    "novavesta-morning-routine";


const DEFAULT_ITEMS = [

    "Get dressed",

    "Brush teeth",

    "Take medications / vitamins",

    "Eat breakfast",

    "Pack everything I need",

    "Check today's schedule",

    "Leave for the day"

];


let data = loadData();


/* ==================================================
   DATE HELPERS
   ================================================== */

function todayKey() {

    const now = new Date();

    return [
        now.getFullYear(),

        String(
            now.getMonth() + 1
        ).padStart(2, "0"),

        String(
            now.getDate()
        ).padStart(2, "0")

    ].join("-");
}


function currentDay() {

    /*
     * JavaScript:
     *
     * Sunday = 0
     * Monday = 1
     * Tuesday = 2
     * Wednesday = 3
     * Thursday = 4
     * Friday = 5
     * Saturday = 6
     */

    return new Date().getDay();
}


/* ==================================================
   LOAD SAVED DATA
   ================================================== */

function loadData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (saved) {

        try {

            const parsed =
                JSON.parse(saved);


            if (
                parsed &&
                Array.isArray(parsed.items)
            ) {

                /*
                 * Upgrade data from previous
                 * versions of NovaVesta.
                 */

                parsed.items.forEach(
                    item => {

                        if (
                            typeof item.completed !==
                            "boolean"
                        ) {

                            item.completed =
                                false;
                        }


                        if (
                            typeof item.completedAt ===
                            "undefined"
                        ) {

                            item.completedAt =
                                null;
                        }


                        if (
                            typeof item.snoozed !==
                            "boolean"
                        ) {

                            item.snoozed =
                                false;
                        }


                        if (
                            typeof item.snoozedUntil ===
                            "undefined"
                        ) {

                            item.snoozedUntil =
                                null;
                        }


                        /*
                         * Existing tasks from the
                         * original version become
                         * everyday tasks.
                         */

                        if (
                            !Array.isArray(
                                item.schedule
                            )
                        ) {

                            item.schedule =
                                ["everyday"];
                        }

                    }
                );


                /*
                 * Make sure the saved data has
                 * a date property.
                 */

                if (
                    !parsed.date
                ) {

                    parsed.date =
                        todayKey();
                }


                return parsed;
            }

        } catch (error) {

            console.error(
                "NovaVesta could not read saved data:",
                error
            );
        }
    }


    /*
     * No saved routine exists.
     * Create the default routine.
     */

    return {

        date:
            todayKey(),

        items:
            DEFAULT_ITEMS.map(
                text => ({

                    id:
                        createId(),

                    text:
                        text,

                    completed:
                        false,

                    completedAt:
                        null,

                    snoozed:
                        false,

                    snoozedUntil:
                        null,

                    schedule:
                        ["everyday"]

                })
            )

    };
}


/* ==================================================
   ID GENERATOR
   ================================================== */

function createId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();
    }


    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2)
    );
}


/* ==================================================
   SAVE
   ================================================== */

function saveData() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(data)

    );
}


/* ==================================================
   NEW DAY CHECK
   ================================================== */

/*
 * We don't need to constantly watch the clock.
 *
 * NovaVesta checks the date when it loads and
 * whenever it renders the list.
 *
 * If you leave it open overnight, nothing
 * needs to happen at midnight itself.
 *
 * The next time you interact with it or
 * refresh/open it the following morning,
 * it notices that the date changed and
 * resets the daily state.
 */

function checkForNewDay() {

    const today =
        todayKey();


    if (
        data.date === today
    ) {

        return;
    }


    data.date =
        today;


    data.items.forEach(
        item => {

            /*
             * Completion is daily.
             */

            item.completed =
                false;

            item.completedAt =
                null;


            /*
             * Snooze is also daily.
             */

            item.snoozed =
                false;

            item.snoozedUntil =
                null;

        }
    );


    saveData();
}


/* ==================================================
   SCHEDULE
   ================================================== */

function isScheduledToday(item) {

    /*
     * An absent/empty schedule means
     * every day. This also protects
     * against old saved data.
     */

    if (
        !Array.isArray(item.schedule) ||
        item.schedule.length === 0
    ) {

        return true;
    }


    if (
        item.schedule.includes(
            "everyday"
        )
    ) {

        return true;
    }


    return item.schedule.includes(
        currentDay()
    );
}


/* ==================================================
   GET VISIBLE ITEMS
   ================================================== */

function getVisibleItems() {

    return data.items.filter(
        item =>
            isScheduledToday(item) &&
            !item.snoozed
    );
}


/* ==================================================
   RENDER
   ================================================== */

function render() {

    checkForNewDay();


    const routine =
        document.getElementById(
            "routine"
        );


    routine.innerHTML =
        "";


    const visibleItems =
        getVisibleItems();


    if (
        visibleItems.length === 0
    ) {

        routine.innerHTML = `

            <div class="empty">

                Nothing left on
                today's routine.

                <br><br>

                Enjoy the morning.

            </div>

        `;

    } else {

        visibleItems.forEach(
            item => {

                renderItem(
                    item,
                    routine
                );

            }
        );
    }


    updateProgress();
}


/* ==================================================
   RENDER ONE TASK
   ================================================== */

function renderItem(
    item,
    routine
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "task-wrapper";


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "item" +
        (
            item.completed
            ? " completed"
            : ""
        );


    /*
     * Build the main task row.
     */

    element.innerHTML = `

        <input
            class="checkbox"
            type="checkbox"
            ${item.completed ? "checked" : ""}
            onchange="
                toggleItem('${item.id}')
            "
            aria-label="Complete task"
        >


        <div class="item-content">

            <div
                class="item-name"
                contenteditable="true"
                spellcheck="false"
                onblur="
                    editItem(
                        '${item.id}',
                        this.innerText
                    )
                "
                onkeydown="
                    handleEditKey(event)
                "
            >${escapeHtml(item.text)}</div>


            <div class="timestamp">

                ${
                    item.completed
                    ? "Completed at " +
                      item.completedAt
                    : ""
                }

            </div>

        </div>


        <button
            class="task-action"
            onclick="
                toggleSchedulePanel(
                    '${item.id}'
                )
            "
            title="Change schedule"
            aria-label="Change schedule"
        >
            ↻
        </button>


        <button
            class="task-action"
            onclick="
                snoozeItem(
                    '${item.id}'
                )
            "
            title="Snooze until tomorrow"
            aria-label="Snooze until tomorrow"
        >
            ◷
        </button>


        <button
            class="task-action delete"
            onclick="
                deleteItem(
                    '${item.id}'
                )
            "
            title="Delete permanently"
            aria-label="Delete permanently"
        >
            ×
        </button>

    `;


    /*
     * Create the schedule panel.
     */

    const schedulePanel =
        document.createElement(
            "div"
        );


    schedulePanel.className =
        "schedule-panel";


    schedulePanel.id =
        "schedule-" +
        item.id;


    schedulePanel.innerHTML =
        createSchedulePicker(
            item
        );


    wrapper.appendChild(
        element
    );


    wrapper.appendChild(
        schedulePanel
    );


    routine.appendChild(
        wrapper
    );
}


/* ==================================================
   SCHEDULE PICKER
   ================================================== */

function createSchedulePicker(
    item
) {

    const days = [

        {
            value: "everyday",
            label: "Every day"
        },

        {
            value: 1,
            label: "Mon"
        },

        {
            value: 2,
            label: "Tue"
        },

        {
            value: 3,
            label: "Wed"
        },

        {
            value: 4,
            label: "Thu"
        },

        {
            value: 5,
            label: "Fri"
        },

        {
            value: 6,
            label: "Sat"
        },

        {
            value: 0,
            label: "Sun"
        }

    ];


    return `

        <div class="schedule-title">
            Repeat
        </div>


        <div class="schedule-options">

            ${days.map(
                day => {

                    const selected =
                        item.schedule.includes(
                            day.value
                        );


                    return `

                        <button
                            class="day-button ${
                                selected
                                ? "selected"
                                : ""
                            }"
                            onclick="
                                toggleSchedule(
                                    '${item.id}',
                                    '${day.value}'
                                )
                            "
                        >
                            ${day.label}
                        </button>

                    `;

                }
            ).join("")}

        </div>

    `;
}


/* ==================================================
   OPEN / CLOSE SCHEDULE PANEL
   ================================================== */

function toggleSchedulePanel(
    id
) {

    const panel =
        document.getElementById(
            "schedule-" + id
        );


    if (!panel) {
        return;
    }


    const wasOpen =
        panel.classList.contains(
            "open"
        );


    /*
     * Close all panels first.
     */

    document
        .querySelectorAll(
            ".schedule-panel"
        )
        .forEach(
            panel => {

                panel.classList.remove(
                    "open"
                );

            }
        );


    /*
     * Re-open the selected one
     * if it wasn't already open.
     */

    if (!wasOpen) {

        panel.classList.add(
            "open"
        );
    }
}


/* ==================================================
   CHANGE SCHEDULE
   ================================================== */

function toggleSchedule(
    id,
    value
) {

    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {
        return;
    }


    /*
     * Convert weekday strings back
     * into numbers.
     */

    if (
        value !== "everyday"
    ) {

        value =
            Number(value);
    }


    /*
     * "Every day" is exclusive.
     */

    if (
        value === "everyday"
    ) {

        item.schedule =
            ["everyday"];

    } else {

        /*
         * If it was previously
         * every day, start a new
         * specific-day schedule.
         */

        if (
            item.schedule.includes(
                "everyday"
            )
        ) {

            item.schedule =
                [value];

        } else if (
            item.schedule.includes(
                value
            )
        ) {

            /*
             * Remove the selected day.
             */

            item.schedule =
                item.schedule.filter(
                    day =>
                        day !== value
                );

        } else {

            /*
             * Add the selected day.
             */

            item.schedule.push(
                value
            );
        }


        /*
         * Don't allow a task to have
         * zero scheduled days.
         *
         * If the user removes the
         * last day, return it to
         * Every day.
         */

        if (
            item.schedule.length === 0
        ) {

            item.schedule =
                ["everyday"];
        }
    }


    saveData();


    render();


    /*
     * Re-open the schedule panel
     * after rendering.
     */

    const panel =
        document.getElementById(
            "schedule-" + id
        );


    if (panel) {

        panel.classList.add(
            "open"
        );
    }
}


/* ==================================================
   COMPLETE / UNCOMPLETE
   ================================================== */

function toggleItem(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {
        return;
    }


    if (
        item.completed
    ) {

        item.completed =
            false;

        item.completedAt =
            null;

    } else {

        item.completed =
            true;


        item.completedAt =
            new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour:
                            "numeric",

                        minute:
                            "2-digit"
                    }
                );
    }


    saveData();

    render();
}


/* ==================================================
   SNOOZE
   ================================================== */

function snoozeItem(
    id
) {

    checkForNewDay();


    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {
        return;
    }


    /*
     * This does NOT change the schedule.
     *
     * It simply says:
     * "Don't show this task today."
     */

    item.snoozed =
        true;

    item.snoozedUntil =
        todayKey();


    saveData();

    render();
}


/* ==================================================
   EDIT TASK
   ================================================== */

function editItem(
    id,
    text
) {

    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {
        return;
    }


    text =
        text.trim();


    /*
     * Don't allow a blank task.
     */

    if (
        text === ""
    ) {

        render();

        return;
    }


    item.text =
        text;


    saveData();
}


function handleEditKey(
    event
) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        event.target.blur();
    }
}


/* ==================================================
   ADD TASK
   ================================================== */

function addItem() {

    checkForNewDay();


    const newItem = {

        id:
            createId(),

        text:
            "New routine item",

        completed:
            false,

        completedAt:
            null,

        snoozed:
            false,

        snoozedUntil:
            null,

        schedule:
            ["everyday"]

    };


    data.items.push(
        newItem
    );


    saveData();

    render();


    /*
     * Put the cursor into the new
     * task immediately.
     */

    setTimeout(
        function() {

            const taskNames =
                document.querySelectorAll(
                    ".item-name"
                );


            const last =
                taskNames[
                    taskNames.length - 1
                ];


            if (!last) {
                return;
            }


            last.focus();


            const range =
                document.createRange();


            range.selectNodeContents(
                last
            );


            const selection =
                window.getSelection();


            selection.removeAllRanges();


            selection.addRange(
                range
            );

        },
        50
    );
}


/* ==================================================
   DELETE TASK
   ================================================== */

function deleteItem(
    id
) {

    const item =
        data.items.find(
            item =>
                item.id === id
        );


    if (!item) {
        return;
    }


    data.items =
        data.items.filter(
            item =>
                item.id !== id
        );


    saveData();

    render();
}


/* ==================================================
   PROGRESS
   ================================================== */

function updateProgress() {

    const visibleItems =
        getVisibleItems();


    const total =
        visibleItems.length;


    const completed =
        visibleItems.filter(
            item =>
                item.completed
        ).length;


    const progress =
        document.getElementById(
            "progress"
        );


    if (
        total === 0
    ) {

        progress.innerHTML =
            "";

        return;
    }


    progress.innerHTML =

        `<strong>${completed}</strong>
         of ${total} completed`;
}


/* ==================================================
   RESET TODAY
   ================================================== */

function resetToday() {

    checkForNewDay();


    if (
        !confirm(
            "Reset all of today's completed and snoozed items?"
        )
    ) {

        return;
    }


    data.items.forEach(
        item => {

            item.completed =
                false;

            item.completedAt =
                null;

            item.snoozed =
                false;

            item.snoozedUntil =
                null;

        }
    );


    saveData();

    render();
}


/* ==================================================
   DATE DISPLAY
   ================================================== */

function updateDate() {

    const date =
        new Date();


    document.getElementById(
        "date"
    ).textContent =

        date.toLocaleDateString(
            [],
            {
                weekday:
                    "long",

                month:
                    "long",

                day:
                    "numeric"
            }
        );
}


/* ==================================================
   ESCAPE HTML
   ================================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;
}


/* ==================================================
   START NOVAVESTA
   ================================================== */

checkForNewDay();

updateDate();

render();

</script>

</body>
</html>
